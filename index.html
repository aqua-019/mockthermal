      off.width = gw; off.height = gh; const img = ox.createImageData(gw, gh), Lt = lut(), bands = 9;
      for (let i = 0; i < fld.length; i++) { const tt = Math.round(Math.pow(fld[i], 0.7) * bands) / bands, li = Math.round((dark ? 0.03 + tt * 0.95 : tt * 0.97) * 255) * 3; img.data[i * 4] = Lt[li]; img.data[i * 4 + 1] = Lt[li + 1]; img.data[i * 4 + 2] = Lt[li + 2]; img.data[i * 4 + 3] = 255; }
      ox.putImageData(img, 0, 0);
      ctx.clearRect(0, 0, f.w, f.h); ctx.imageSmoothingEnabled = true; ctx.drawImage(off, pl, pt, W, H);
      ctx.strokeStyle = dark ? 'rgba(0,0,0,.4)' : 'rgba(255,255,255,.6)'; ctx.lineWidth = 0.8 * d;
      for (let k = 1; k < bands; k++) G.strokeSegs(ctx, G.isolines(fld.map(v => Math.pow(v, 0.7)), gw, gh, (k - 0.5) / bands), W / (gw - 1), H / (gh - 1), pl, pt);
      const ink3 = css('--fg-3'); ctx.font = `400 ${9.5 * d}px "Martian Mono", ui-monospace, monospace`; ctx.textBaseline = 'middle';
      [5000, 10000, 25000, 50000, 100000, 250000, 500000].forEach(p => { const y = Y(p); ctx.fillStyle = ink3; ctx.textAlign = 'right'; ctx.fillText(F.usd(p, { whole: true }).replace(',000', 'k'), pl - 8 * d, y); ctx.fillStyle = dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)'; ctx.fillRect(pl, Math.round(y), W, 1); });
      ctx.textAlign = 'center'; for (let t = Math.ceil(t0 / (7 * 864e5)) * 7 * 864e5; t < t1; t += 7 * 864e5) { ctx.fillStyle = ink3; ctx.fillText(F.date(t, { month: 'short', day: 'numeric' }).toUpperCase(), X(t), f.h - pb / 2); }
      pts.forEach(q => { ctx.beginPath(); ctx.arc(q.x, q.y, 3.6 * d, 0, Math.PI * 2); if (q.r.kind === 'art') { ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.strokeStyle = '#07080A'; ctx.lineWidth = d; ctx.stroke(); } else { ctx.strokeStyle = '#07080A'; ctx.lineWidth = 2.6 * d; ctx.stroke(); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.2 * d; ctx.stroke(); } });
    };
    draw();
    const ro = new ResizeObserver(() => draw()); ro.observe(cv);
    const offT = onTheme(draw);
    cv.addEventListener('pointermove', (e) => {
      if (!Lm) return; const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * Lm.d, y = (e.clientY - r.top) * Lm.d;
      let best = null, bd = 14 * Lm.d; pts.forEach(q => { const dd = Math.hypot(q.x - x, q.y - y); if (dd < bd) { bd = dd; best = q; } });
      if (!best) { tip.hidden = true; return; }
      tip.innerHTML = '<b>' + esc(best.r.title) + '</b><span>' + F.usd(best.p) + '</span> · ' + esc(best.r.type) + ' · ' + esc(F.date(best.t, { month: 'short', day: 'numeric', year: 'numeric' }));
      tip.hidden = false; tip.style.left = C.clamp(best.x / Lm.d, 120, r.width - 120) + 'px'; tip.style.top = (best.y / Lm.d) + 'px';
    });
    cv.addEventListener('pointerleave', () => { tip.hidden = true; });
    return [() => ro.disconnect(), offT];
  };

  /* ================================================================ GUIDE: the hot zone, by hand */
  SK.hotZoneDemo = () => `<div class="hzd" data-d="D6275 D3993 NOPAIR-18 PAIR-91">
      <div class="hzd__top"><p class="eyebrow">Try the hot zone · a demo clock at six times speed</p><b class="hzd__t" data-hzd-t>02:30</b></div>
      <div class="hzm" data-hzd-m aria-hidden="true"><i class="hzm__pre"></i><i class="hzm__bar"></i></div>
      <p class="hzd__msg" data-hzd-msg aria-live="polite">Thirty seconds before the hot zone. Bids placed now leave the clock alone.</p>
      <div class="hzd__acts"><button type="button" class="btn btn--ink" data-hzd-bid>Place a leading bid</button><button type="button" class="btn btn--ghost" data-hzd-restart>Restart the demo</button></div>
      <ol class="hzd__log" data-hzd-log></ol></div>`;
  SK.hotZoneMount = (el) => {
    if (!el) return null;
    const T = C.$('[data-hzd-t]', el), m = C.$('[data-hzd-m]', el), bar = C.$('.hzm__bar', m), pre = C.$('.hzm__pre', m), msg = C.$('[data-hzd-msg]', el), log = C.$('[data-hzd-log]', el), box = C.$('.hzd', el);
    let left = 150000, done = false, vis = true, bids = 0;
    const say = (s, cls) => { msg.textContent = s; const li = document.createElement('li'); li.textContent = F.clock(left) + ' — ' + s; if (cls) li.className = cls; log.prepend(li); };
    const unvis = G.visible(el, v => { vis = v; });
    const stop = C.loop.add((dt) => {
      if (!vis || done) return;
      const was = left; left = Math.max(0, left - dt * 6);
      if (was > C.HOT && left <= C.HOT) say('The hot zone has begun. A leading bid now resets the clock to 2:00.');
      if (left <= 0) { done = true; say(bids ? 'Two minutes passed with no new leader. Sold — the record is permanent.' : 'The clock ran out with no bid. Unsold.'); }
      T.textContent = F.clock(left); const hot = left <= C.HOT && left > 0; box.classList.toggle('is-hot', hot);
      if (hot) { bar.style.opacity = 1; pre.style.opacity = 0; bar.style.setProperty('--w', (left / C.HOT).toFixed(4)); } else { bar.style.opacity = 0; pre.style.opacity = 1; pre.style.setProperty('--p', left > C.HOT ? (1 - (left - C.HOT) / 30000).toFixed(4) : 1); }
    });
    C.$('[data-hzd-bid]', el).onclick = () => { if (done) return; bids++; if (left <= C.HOT) { const at = left; left = C.HOT; m.classList.remove('is-reset'); void m.offsetWidth; m.classList.add('is-reset'); say('Leading bid at ' + F.clock(at) + ' — the clock resets to 2:00.', 'is-reset'); } else say('Leading bid placed outside the hot zone — the clock keeps running.'); };
    C.$('[data-hzd-restart]', el).onclick = () => { left = 150000; done = false; bids = 0; log.innerHTML = ''; msg.textContent = 'Thirty seconds before the hot zone. Bids placed now leave the clock alone.'; };
    return [stop, unvis];
  };

  /* ================================================================ PAY */
  SK.qr = (cv, inv) => {
    G.drawQR(cv, inv.ref || inv.id, '#07080A', '#FFFFFF');
    const ctx = cv.getContext('2d'), f = G.fit(cv);
    ctx.save(); ctx.translate(f.w / 2, f.h / 2); ctx.rotate(-Math.PI / 9);
    ctx.font = `600 ${Math.round(f.w * 0.07)}px "Martian Mono", ui-monospace, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = f.w * 0.035; ctx.strokeStyle = '#FFFFFF'; ctx.strokeText('DEMO · NOT PAYABLE', 0, 0); ctx.fillStyle = '#E6338F'; ctx.fillText('DEMO · NOT PAYABLE', 0, 0);
    ctx.restore();
  };
  SK.receipt = (cv, inv) => { G.receiptArt(cv, inv.txid || inv.preimage || inv.id, { kind: 'bars', ink: css('--fg'), paper: css('--sheet') }); };

  /* ================================================================ SPLASH: the thermal boot (first visit, honest progress, skippable, 10 s watchdog — LAW-66) */
  C.splash = {
    playing: false,
    play(force) {
      if (this.playing) return;
      if (!force && C.ss.get('splashB', 0)) return;
      C.ss.set('splashB', 1); this.playing = true;
      const el = document.createElement('div'); el.className = 'spl'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Loading CLCT'); el.setAttribute('tabindex', '-1');
      const cells = D.marks.map((m, i) => `<i style="--c:${tcol(i / 99)}" data-cell="${i}"></i>`).join('');
      el.innerHTML = `<div class="spl__box"><ol class="spl__log" data-log aria-live="polite"></ol>
        <div class="spl__wallwrap"><div class="spl__wall" data-wall>${cells}</div><div class="spl__mark"><canvas data-smark aria-hidden="true"></canvas></div></div>
        <div class="spl__foot"><span data-sn>000 / 100</span><div class="spl__meter"><i data-sb></i></div><button type="button" class="spl__skip" data-skip-spl>Skip <kbd>Esc</kbd></button></div></div>`;
      document.body.appendChild(el); try { el.focus({ preventScroll: true }); } catch (e) { }
      const log = C.$('[data-log]', el), wall = C.$('[data-wall]', el), bar = C.$('[data-sb]', el), num = C.$('[data-sn]', el);
      const line = (html) => { const li = document.createElement('li'); li.innerHTML = html; log.appendChild(li); requestAnimationFrame(() => li.classList.add('is-in')); return li; };
      line('<b>CLCT/THERMAL</b> 26.10 · boot');
      const t0 = performance.now(); let finished = false, loaded = 0, shown = 0, stage = 0, progLine = null, ft = null;
      const lit = new Set();
      const finish = (why) => {
        if (finished) return; finished = true; clearTimeout(wd); document.removeEventListener('keydown', esc2, true);
        bar.style.transform = 'scaleX(1)';
        const out = () => { el.classList.add('is-out'); setTimeout(() => { el.remove(); if (ft) ft.destroy(); this.playing = false; try { (C.$('#view h1') || C.$('#view')).focus({ preventScroll: true }); } catch (e) { } }, C.motion.reduced ? 0 : 420); };
        if (why === 'skip' || C.motion.reduced) { out(); return; }
        line(why === 'watchdog' ? '<span class="wip">[..]</span> running late — opening anyway' : '<span class="ok">[ok]</span> session · <b>' + C.session.list().length + ' lots</b> · ' + C.session.live().length + ' live · ' + C.session.upcoming().length + ' opening');
        wall.classList.add('is-collapse');
        C.$$('i', wall).forEach((c, i) => { const x = i % 10 - 4.5, y = Math.floor(i / 10) - 4.5; c.style.transitionDelay = Math.round(Math.hypot(x, y) * 26) + 'ms'; });
        const cv = C.$('[data-smark]', el);
        ft = new G.FieldType(cv, { source: 'logo', mode: 'thermal', lut: G.tempLUT, scale: .5, cycle: 4.4, animate: true, ground: 'clear', pad: 0.06 });
        setTimeout(() => { if (ft) { ft.o.hold = true; } }, 1700);
        setTimeout(out, 2300);
      };
      const esc2 = (e) => { if (e.key === 'Escape') { e.preventDefault(); finish('skip'); } };
      document.addEventListener('keydown', esc2, true);
      C.$('[data-skip-spl]', el).onclick = () => finish('skip');
      const wd = setTimeout(() => finish('watchdog'), 10000);
      const tick = () => {
        if (finished) return;
        const target = Math.min(loaded, C.motion.reduced ? 100 : Math.floor((performance.now() - t0) / 1800 * 100));
        while (shown < target) { const c = wall.children[shown]; if (c && !lit.has(shown)) { lit.add(shown); c.style.backgroundImage = 'url("' + D.marks[shown].src + '")'; c.classList.add('is-on', 'is-hot'); const cc = c; setTimeout(() => cc.classList.remove('is-hot'), 60); } shown++; }
        num.textContent = String(shown).padStart(3, '0') + ' / 100'; bar.style.transform = 'scaleX(' + (shown / 100).toFixed(3) + ')';
        if (stage === 0 && shown >= 8) { stage = 1; line('<span class="ok">[ok]</span> house clock synced · <b>' + esc(F.time(C.clock.now(), true)) + '</b>'); }
        if (stage === 1 && shown >= 22) { stage = 2; line('<span class="ok">[ok]</span> indicative quote · BTC/USD <b>$' + Math.round(C.quote.usd).toLocaleString('en-US') + '</b>'); progLine = line(''); }
        if (progLine) progLine.innerHTML = (shown < 100 ? '<span class="wip">[..]</span>' : '<span class="ok">[ok]</span>') + ' stylings of the mark · <b>' + shown + ' / 100</b>';
        if (shown >= 100) { finish('done'); return; }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      G.preload(D.marks.map(m => m.src), (n) => { loaded = n; });
    }
  };

  /* ================================================================ AFTER */
  SK.after = () => {
    const cnt = C.$('[data-live-count]'), rl = C.$('[data-rail-live]'), ru = C.$('[data-rail-up]'), rn = C.$('[data-rail-next]'), rc = C.$('[data-rail-chg]');
    const upd = () => { const live = C.session.live(); if (cnt) cnt.textContent = live.length; rl.textContent = live.length; ru.textContent = C.session.upcoming().length; };
    upd(); C.on('lot', upd); C.on('session', upd);
    C.loop.add((dt, now) => { if ((now / 250 | 0) === upd._t) return; upd._t = now / 250 | 0; const n = C.session.live().sort((x, y) => x.endsAt - y.endsAt)[0]; const t = n ? 'LOT ' + lotNo(n.rec) + ' ' + F.clock(n.endsAt - now) : '—'; if (rn.textContent !== t) rn.textContent = t; });
    const q0 = C.quote.hist[0] ? C.quote.hist[0].v : C.quote.usd; const chg = () => { const p = (C.quote.usd - q0) / q0 * 100; rc.className = p >= 0 ? 'hd__up' : 'hd__dn'; rc.textContent = (p >= 0 ? '▲' : '▼') + Math.abs(p).toFixed(2) + '%'; }; chg(); C.on('quote', chg);
    C.$('[data-skip]').addEventListener('click', (e) => { e.preventDefault(); const v = C.$('#view'); v.focus(); v.scrollIntoView(); });
    galleryWire();
    // the header mark: CAP-346 held at its peak; every bid anywhere warms it a little
    const hm = C.$('[data-hdmark]');
    if (hm) {
      const make = () => { SK._hdmark = new G.FieldType(hm, { source: 'logo', mode: 'thermal', lut: lut(), scale: .7, animate: false, still: true, ground: 'clear', pad: 0.1, intensity: 0.9 }); };
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(make);
      C.on('bid', () => SK._hdmark && SK._hdmark.kick(0.22));
      onTheme(() => { if (SK._hdmark) { SK._hdmark.o.lut = lut(); SK._hdmark.dirty = true; } });
      C.$('.hd__logo').addEventListener('pointerenter', () => SK._hdmark && SK._hdmark.kick(0.45));
    }
    // footer isotherms, drawn once and redrawn on resize, theme or touch
    const fc = C.$('[data-ftheat]');
    if (fc) {
      const make = () => { const ft = new G.FieldType(fc, { source: 'logo', mode: 'bands', bands: 9, isolines: 'rgba(0,0,0,.32)', lut: lut(), scale: .3, animate: false, still: true, ground: 'clear', pad: 0.16, sigma: .08, intensity: 1 }); onTheme(() => { ft.o.lut = lut(); ft.o.isolines = isDark() ? 'rgba(0,0,0,.32)' : 'rgba(255,255,255,.5)'; ft.dirty = true; }); fc.addEventListener('pointerenter', () => ft.kick(0.35)); };
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(make);
    }
    // every lot card's slab: fills with elapsed time, warms toward the close
    C.loop.add((dt, now) => {
      if ((now / 200 | 0) === SK._st) return; SK._st = now / 200 | 0;
      C.$$('[data-slab-of]').forEach(s => { const a = C.session.get(s.dataset.slabOf); if (!a) return; const total = Math.max(1, a.scheduledEnd - a.opensAt), f = a.state === 'live' ? C.clamp(1 - (a.endsAt - now) / total, 0.03, 1) : a.state === 'upcoming' ? 0 : 1; s.style.setProperty('--f', f.toFixed(3)); });
    });
    // mobile menu
    const mb = C.$('[data-menu]');
    mb.addEventListener('click', () => {
      mb.setAttribute('aria-expanded', 'true');
      const cur = C.router.current ? C.router.current.token : '';
      const link = (k, t) => `<li><a href="#${k}" data-go="${k}"${cur === k ? ' aria-current="page"' : ''}>${t}${C.icon('right')}</a></li>`;
      C.overlay.open({ title: 'CLCT', variant: 'right', origin: mb, html: `<div class="mnav"><div><p class="eyebrow">Auction house</p><ul>${link('auctions', 'Auctions')}${link('sell', 'Sell with CLCT')}${link('how', 'How it works')}${link('account-watchlist', 'Watchlist')}${link('account', 'Your record')}</ul></div><div><p class="eyebrow">Departments</p><ul>${DEPTS.map(([k, t]) => link(k, t)).join('')}</ul></div><div class="mnav__meta"><span>BTC/USD <b data-live-quote>$${Math.round(C.quote.usd).toLocaleString('en-US')}</b> · indicative</span><span>House time <span data-live-house></span></span></div></div>`, onClose: () => mb.setAttribute('aria-expanded', 'false') });
    });
    C.$('[data-alerts]').addEventListener('click', (e) => {
      const hd = C.overlay.open({ title: 'Auction alerts', origin: e.currentTarget, html: `<p class="note">Alerts go to the email on your collector record (${esc(C.user.display)} · demo collector). Choose what you hear about:</p><fieldset class="fs"><legend>Email me about</legend><label class="check"><input type="checkbox" checked><span>Auction openings</span></label><label class="check"><input type="checkbox" checked><span>Closing reminders, about an hour before a watched lot closes</span></label><label class="check"><input type="checkbox"><span>New collection releases</span></label></fieldset><div class="review__acts"><button type="button" class="btn btn--ink" data-save>Save alert settings</button><button type="button" class="btn btn--ghost" data-close>Cancel</button></div><p class="note small">This mockup sends no email.</p>` });
      C.$('[data-save]', hd.root).onclick = () => { hd.close('done'); C.toast({ title: 'Alert settings saved', body: 'Openings and closing reminders are on for ' + C.user.display + '.', kind: 'ok' }); };
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => C.emit('theme', C.theme.pref));
    C.splash.play(false);
  };

  C.boot = () => C.app.init(SK);
})();

window.CLCT.boot();
</script>

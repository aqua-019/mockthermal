<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CLCT Thermal</title>
<meta name="description" content="A design mockup for a CLCT redesign — simulated auctions, offers and payments.">
<meta name="theme-color" content="#07080A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap">
<style>
/* ===================================================================
   CLCT mockup — shared structure (token-driven; each skin supplies the tokens)
   Part 1: foundation, primitives, forms, overlays, toasts, palette, console, tour, spec layer
   =================================================================== */

/* ---------- structural tokens (skins override) ---------- */
:root {
  --maxw: 1320px;
  --gut: clamp(16px, 4vw, 48px);
  --sec-gap: clamp(44px, 6vw, 92px);
  --hd-h: 104px;
  --t-xs: 11.5px; --t-sm: 13.5px; --t-md: 15.5px; --t-lg: 18px; --t-xl: 22px;
  --t-2xl: clamp(24px, 2.6vw, 32px); --t-3xl: clamp(32px, 4.6vw, 54px); --t-4xl: clamp(40px, 7.2vw, 96px);
  --bw: 1px;
}

/* ---------- foundation ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--hd-h) + 12px); scrollbar-color: var(--line-3) transparent; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--fg);
  font: 400 var(--t-md)/1.5 var(--f-ui);
  font-kerning: normal; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
}
img, svg, canvas, video { max-width: 100%; }
img { display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: not-allowed; }
h1, h2, h3, h4 { text-wrap: balance; }
p { text-wrap: pretty; }
kbd { font: 500 11px/1 var(--f-mono); padding: 3px 6px; border: 1px solid var(--line-2); border-radius: var(--r); color: var(--fg-3); background: transparent; }
::selection { background: var(--sel); color: var(--fg); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; } /* LAW-32: 2px ring with its own gap */
[hidden] { display: none !important; }

.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); }
.small { font-size: var(--t-xs); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.ic { width: 18px; height: 18px; flex: none; }
.sel { user-select: all; }

.skip { position: fixed; left: 16px; top: -80px; z-index: 120; padding: 10px 14px; background: var(--fg); color: var(--bg); text-decoration: none; font-weight: 600; border-radius: var(--r); transition: top var(--d2) var(--ease); }
.skip:focus { top: calc(12px + env(safe-area-inset-top, 0px)); }

/* page grid: content column with a gutter that never drops below 16px */
#view {
  display: grid;
  grid-template-columns: [full-start] minmax(var(--gut), 1fr) [content-start] minmax(0, var(--maxw)) [content-end] minmax(var(--gut), 1fr) [full-end];
  align-content: start; min-height: 70vh; padding-bottom: var(--sec-gap);
}
#view > * { grid-column: content; min-width: 0; }
#view > .bleed { grid-column: full; }
#view:focus, #view [tabindex="-1"]:focus { outline: none; }

/* ---------- labels & text ---------- */
.eyebrow, .lbl {
  font: 500 var(--t-label, 11px)/1.3 var(--label-font, var(--f-mono));
  letter-spacing: var(--label-track, .08em); text-transform: uppercase; color: var(--fg-3);
}
.eyebrow { margin: 0 0 8px; }
.prose { max-width: 66ch; line-height: 1.68; color: var(--fg-2); margin: 0 0 14px; }
.note { font-size: var(--t-sm); color: var(--fg-2); line-height: 1.55; margin: 10px 0; }
.note .ic { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
.note.small, .prose.small { font-size: var(--t-xs); }
.count { margin: 0; font: 500 11px/1.3 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.sub { margin: 30px 0 10px; font: var(--h3-font); letter-spacing: var(--h-track, 0); }
.big { display: block; margin: 0 0 6px; font: var(--stat-font); font-size: clamp(26px, 3vw, 36px); color: var(--fg); }

/* ---------- buttons & links ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border: var(--bw) solid transparent; border-radius: var(--r);
  font: var(--btn-font, 600 var(--t-sm)/1 var(--f-ui)); letter-spacing: var(--btn-track, .01em); text-transform: var(--btn-case, none);
  text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: background-color var(--d2) var(--ease), color var(--d2) var(--ease), border-color var(--d2) var(--ease);
}
.btn .ic { width: 18px; height: 18px; }
.btn--ink { background: var(--btn); color: var(--btn-fg); }
.btn--ink:hover { background: var(--btn-h); }
.btn--line { border-color: var(--line-3); color: var(--fg); background: transparent; }
.btn--line:hover { border-color: var(--fg); background: var(--bg-2); }
.btn--ghost { color: var(--fg-2); padding: 0 10px; min-height: 38px; }
.btn--ghost:hover { color: var(--fg); background: var(--bg-2); }
.btn--block { width: 100%; }
.btn--xs { min-height: 28px; padding: 0 8px; font-size: var(--t-xs); gap: 5px; }
.btn--xs .ic { width: 14px; height: 14px; }
.btn.is-busy { cursor: progress; }
.btn.is-busy::before { content: ''; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.lnk {
  display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-weight: 500;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: var(--line-3);
  transition: color var(--d2) var(--ease), text-decoration-color var(--d2) var(--ease);
}
.lnk:hover { color: var(--accent-ink); text-decoration-color: currentColor; }
.lnk .ic { width: 16px; height: 16px; }
button.lnk { padding: 0; }

/* ---------- tags, pills, badges, chips, segmented ---------- */
.tag {
  display: inline-flex; align-items: center; height: 20px; padding: 0 6px;
  border: 1px solid var(--line-2); border-radius: var(--r);
  font: 500 10.5px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--fg-2); white-space: nowrap;
}
.tag--hot { border-color: var(--hot); color: var(--hot-ink); background: var(--hot-tint); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px;
  border: 1px solid var(--line-2); border-radius: var(--r-pill, 999px);
  font: 500 11px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--fg-2); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.pill--live { color: var(--live-ink); border-color: var(--live); }
.pill--live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
.pill--muted { color: var(--fg-3); border-style: dashed; }
.pill--ok { color: var(--ok); border-color: currentColor; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; background: var(--bg-3); color: var(--fg-2); font: 500 10.5px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; border-radius: var(--r); }
.badge--sold { background: var(--fg); color: var(--bg); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; height: 34px; padding: 0 12px;
  border: 1px solid var(--line-2); border-radius: var(--r-pill, 999px); background: transparent;
  font: 500 var(--t-sm)/1 var(--f-ui); color: var(--fg-2); white-space: nowrap;
  transition: background-color var(--d2) var(--ease), color var(--d2) var(--ease), border-color var(--d2) var(--ease);
}
.chip:hover { border-color: var(--fg-3); color: var(--fg); }
.chip.is-on, .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); padding: 2px; gap: 2px; background: var(--bg); flex: none; }
.seg button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 11px;
  border-radius: max(0px, calc(var(--r) - 2px)); font: 500 12px/1 var(--f-mono); letter-spacing: .03em; color: var(--fg-3);
  transition: background-color var(--d2) var(--ease), color var(--d2) var(--ease);
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg .ic { width: 16px; height: 16px; }
.seg--big { display: flex; width: 100%; }
.seg--big button { flex: 1; height: 46px; font: 600 var(--t-sm)/1 var(--f-ui); }

/* ---------- forms ---------- */
.field { display: grid; gap: 6px; margin: 0 0 14px; min-width: 0; }
.field > label, .fs > legend {
  font: 500 var(--t-label, 11px)/1.3 var(--label-font, var(--f-mono)); letter-spacing: var(--label-track, .08em);
  text-transform: uppercase; color: var(--fg-3);
}
input:not([type]), input[type="text"], input[type="search"], input[type="number"], input[type="email"], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; margin: 0;
  border: 1px solid var(--line-2); border-radius: var(--r); background: var(--field); color: var(--fg);
  font: 400 var(--t-md)/1.3 var(--f-ui); transition: border-color var(--d2) var(--ease);
}
input::placeholder, textarea::placeholder { color: var(--fg-4); }
input:hover, select:hover, textarea:hover { border-color: var(--line-3); }
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--fg); }
textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
select {
  appearance: none; -webkit-appearance: none; padding-right: 38px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
  background-position: calc(100% - 19px) 52%, calc(100% - 14px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
}
.money { display: flex; align-items: stretch; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--field); transition: border-color var(--d2) var(--ease); }
.money:hover { border-color: var(--line-3); }
.money:focus-within { border-color: var(--fg); outline: 2px solid var(--focus); outline-offset: 2px; }
.money > span { display: grid; place-items: center; padding-left: 12px; font: 500 var(--t-lg)/1 var(--f-mono); color: var(--fg-3); }
.money input { flex: 1; min-width: 0; border: 0; background: transparent; font: 600 var(--t-lg)/1 var(--f-mono); font-variant-numeric: tabular-nums; padding-left: 6px; }
.money input:focus-visible { outline: none; }
.money__step { width: 44px; flex: none; display: grid; place-items: center; border-left: 1px solid var(--line); color: var(--fg-2); transition: background-color var(--d2) var(--ease), color var(--d2) var(--ease); }
.money__step:hover { background: var(--bg-2); color: var(--fg); }
.hint { margin: 0; font-size: var(--t-xs); color: var(--fg-3); line-height: 1.5; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; font-size: var(--t-sm); line-height: 1.45; color: var(--fg); }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--fg); flex: none; cursor: pointer; }
.fs { border: 0; padding: 0; margin: 0 0 18px; min-width: 0; }
.fs > legend { padding: 0; margin: 0 0 8px; }
.range { position: relative; height: 30px; margin: 4px 0 0; }
.range::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line-2); transform: translateY(-50%); }
.range__fill { position: absolute; top: 50%; height: 2px; background: var(--fg); transform: translateY(-50%); }
.range input[type="range"] { position: absolute; inset: 0; width: 100%; height: 30px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; z-index: 1; }
.range input[type="range"]::-webkit-slider-runnable-track { background: transparent; height: 30px; }
.range input[type="range"]::-moz-range-track { background: transparent; }
.range input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 20px; height: 20px; margin-top: 5px; border-radius: 50%; background: var(--field); border: 2px solid var(--fg); cursor: grab; }
.range input[type="range"]::-moz-range-thumb { pointer-events: auto; width: 16px; height: 16px; border-radius: 50%; background: var(--field); border: 2px solid var(--fg); cursor: grab; }
.range input[type="range"]:focus-visible { outline: none; }
.range input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--focus); outline-offset: 2px; }
.range__out { margin: 6px 0 10px; font-size: var(--t-sm); }
.stepper { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--field); }
.stepper button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--fg-2); }
.stepper button:hover { color: var(--fg); background: var(--bg-2); }
.stepper input { width: 64px; min-height: 44px; border: 0; border-inline: 1px solid var(--line); border-radius: 0; text-align: center; font-family: var(--f-mono); -moz-appearance: textfield; background: transparent; }
.stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* ---------- small structures ---------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 22px 0 20px; font: 500 var(--t-label, 11px)/1.4 var(--label-font, var(--f-mono)); letter-spacing: var(--label-track, .08em); text-transform: uppercase; color: var(--fg-4); }
.crumbs a { color: var(--fg-3); text-decoration: none; transition: color var(--d2) var(--ease); }
.crumbs a:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.crumbs [aria-current] { color: var(--fg); }
.slugline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font: 500 10.5px/1.2 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.slugline > svg { width: 14px; height: 14px; flex: none; }
.slugline__sim { margin-left: auto; }
.simnote { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0 0; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: var(--r); font-size: var(--t-xs); color: var(--fg-3); line-height: 1.5; }
.simnote .ic { width: 16px; height: 16px; margin-top: 1px; }
.nophoto { display: grid; place-items: center; width: 100%; height: 100%; min-height: 72px; padding: 8px; background: repeating-linear-gradient(135deg, var(--bg-2) 0 9px, var(--bg-3) 9px 10px); color: var(--fg-3); font: 500 10px/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.dual__btc { color: var(--fg-3); font: 12px var(--f-mono); }
.spark { width: 120px; height: 28px; display: block; overflow: visible; }
.spark rect { fill: var(--fg-4); }
.spark rect.is-top { fill: var(--fg); }
.spark rect.is-you { fill: var(--you); }
.spark line { stroke: var(--line-2); }
.roll { display: inline-block; overflow: hidden; vertical-align: top; }
.roll > span { display: inline-block; animation: digitIn var(--d3) var(--ease-money, var(--ease)) both; }
@keyframes digitIn { from { transform: translateY(70%); opacity: 0; } to { transform: none; opacity: 1; } }
.is-flash { animation: flashInk 1200ms var(--ease) both; }
@keyframes flashInk { from { color: var(--flash); } to { color: var(--fg); } }

/* ---------- section scaffolding ---------- */
.sec { margin-block: var(--sec-gap) 0; }
.sh { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin: 0 0 24px; padding-top: 14px; border-top: var(--sh-rule, 1px solid var(--line-2)); }
.sh__l { min-width: 0; flex: 1 1 360px; }
.sh__t { margin: 0; font: var(--h2-font); letter-spacing: var(--h-track, -.01em); }
.sh__lede { margin: 6px 0 0; color: var(--fg-3); max-width: 62ch; font-size: var(--t-sm); }
.sh__r { flex: none; }
.sec__more { margin: 20px 0 0; }
.ph { display: grid; gap: 12px; padding: clamp(28px, 5vw, 64px) 0 clamp(22px, 3vw, 34px); }
.ph .eyebrow { margin: 0; }
.ph__t { margin: 0; font: var(--ph-font); letter-spacing: var(--ph-track, -.02em); max-width: 22ch; }
.ph__lede { margin: 0; max-width: 64ch; color: var(--fg-2); font-size: var(--t-lg); line-height: 1.5; }
.ph .count { margin-top: 4px; }
@media (min-width: 900px) { .ph--split { grid-template-columns: 1fr 1fr; align-items: end; gap: 24px 48px; } }
.tabs { display: flex; gap: 4px 24px; border-bottom: 1px solid var(--line-2); margin: 0 0 28px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a, .tabs button { position: relative; flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 13px 0; text-decoration: none; font: var(--tab-font, 500 var(--t-sm)/1 var(--f-ui)); letter-spacing: var(--tab-track, 0); text-transform: var(--tab-case, none); color: var(--fg-3); transition: color var(--d2) var(--ease); }
.tabs a:hover, .tabs button:hover { color: var(--fg); }
.tabs [aria-current="page"], .tabs [aria-pressed="true"] { color: var(--fg); }
.tabs [aria-current="page"]::after, .tabs [aria-pressed="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--tab-ind, var(--fg)); }
.tabs__n { font: 500 11px/1 var(--f-mono); color: var(--fg-3); padding: 3px 5px; border: 1px solid var(--line); border-radius: var(--r); font-variant-numeric: tabular-nums; }
.empty { display: grid; gap: 10px; justify-items: center; padding: 36px 24px; border: 1px dashed var(--line-2); border-radius: var(--r); text-align: center; color: var(--fg-2); }
.empty p { margin: 0; max-width: 56ch; }

/* ---------- overlays (modal · sheet · right drawer) ---------- */
html.has-ov { overflow: hidden; }
.ov { position: fixed; inset: 0; z-index: calc(60 + var(--nest, 0)); display: grid; place-items: center; padding: 16px; }
.ov__scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity var(--d3) var(--ease); }
.ov.is-open .ov__scrim { opacity: 1; }
.ov__panel {
  position: relative; width: min(560px, 100%); max-height: min(88vh, 900px); overflow: auto; overscroll-behavior: contain;
  background: var(--sheet); color: var(--fg); border: 1px solid var(--line-2); border-radius: var(--r-2); box-shadow: var(--shadow-2);
  opacity: 0; transform: scale(.96); transition: opacity var(--d3) var(--ease), transform var(--d3) var(--ease);
}
.ov.is-open .ov__panel { opacity: 1; transform: none; }
.ov__panel:focus { outline: none; }
.ov.is-leaving .ov__panel { opacity: 0; transform: scale(.97); transition-duration: var(--d2); }
.ov.is-leaving .ov__scrim { opacity: 0; transition-duration: var(--d2); }
.ov.ov--behind .ov__panel { transform: scale(.97); }
.ov__head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; background: var(--sheet); border-bottom: 1px solid var(--line); }
.ov__title { margin: 0; font: var(--h3-font); letter-spacing: var(--h-track, 0); }
.ov__x { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: var(--r); color: var(--fg-2); transition: background-color var(--d2) var(--ease), color var(--d2) var(--ease); }
.ov__x:hover { background: var(--bg-2); color: var(--fg); }
.ov__body { padding: 16px 18px 22px; }
.ov--sheet { place-items: end stretch; padding: 0; }
.ov--sheet .ov__panel { width: 100%; max-height: 92vh; border-radius: var(--r-2) var(--r-2) 0 0; border-bottom: 0; transform: translateY(28px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ov--sheet.is-open .ov__panel { transform: none; }
.ov--sheet.is-leaving .ov__panel { transform: translateY(20px); }
.ov__grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-3); margin: 8px auto 0; }
.ov--right { place-items: stretch end; padding: 0; }
.ov--right .ov__panel { width: min(420px, 92vw); height: 100%; max-height: none; border-radius: 0; border-block: 0; border-right: 0; transform: translateX(28px); }
.ov--right.is-open .ov__panel { transform: none; }
.ov--right.is-leaving .ov__panel { transform: translateX(20px); }

.review__lot { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; margin: 0 0 14px; }
.review__lot > img, .review__lot > .nophoto { width: 72px; height: 72px; object-fit: contain; background: var(--bg-2); }
.review__lot p { margin: 0; }
.review__t { margin: 2px 0 !important; font-weight: 600; line-height: 1.3; }
.review__acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.review__msg { margin: 10px 0 0; color: var(--err); font-size: var(--t-sm); min-height: 1.2em; }
.review__msg:empty { min-height: 0; margin: 0; }
.ledgerx { display: grid; margin: 12px 0; border-top: 1px solid var(--line-2); }
.ledgerx > div { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: var(--t-sm); }
.ledgerx dt { color: var(--fg-2); }
.ledgerx dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.ledgerx .ledgerx__total { border-bottom: 2px solid var(--fg); font-weight: 600; }
.ledgerx__total dt { color: var(--fg); }
.ledgerx__total dd .muted { display: block; margin-top: 2px; font-size: var(--t-xs); font-weight: 400; }

/* ---------- command palette ---------- */
.ov.pal { place-items: start center; padding-top: max(16px, 10vh); }
.pal .ov__panel { width: min(640px, 100%); }
.pal__field { display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--field); }
.pal__field:focus-within { border-color: var(--fg); outline: 2px solid var(--focus); outline-offset: 2px; }
.pal__field > .ic { width: 20px; height: 20px; color: var(--fg-3); }
.pal__field .pal__input { flex: 1; border: 0; background: transparent; min-height: 50px; padding: 0; font-size: var(--t-lg); }
.pal__field .pal__input:focus-visible { outline: none; }
.pal__res { display: grid; gap: 2px; margin: 12px 0 8px; max-height: 52vh; overflow: auto; }
.pal__item { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border-radius: var(--r); text-align: left; transition: background-color var(--d1) var(--ease); }
.pal__item img, .pal__ph { width: 44px; height: 44px; object-fit: cover; background: var(--bg-2); display: block; }
.pal__item.is-active, .pal__item:hover { background: var(--bg-2); }
.pal__t { display: grid; gap: 1px; min-width: 0; }
.pal__t b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal__type { font: 500 10px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.pal__sub { font-size: var(--t-xs); color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal__hint, .pal__empty { font-size: var(--t-xs); color: var(--fg-3); margin: 6px 0 0; }

/* ---------- toasts (three visible, countdown edge, pause on hover/focus) ---------- */
.toasts { position: fixed; z-index: 85; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 32px)); display: grid; pointer-events: none; }
.toast {
  --ty: 0px; grid-area: 1 / 1; align-self: end; pointer-events: auto; position: relative; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: start; gap: 4px 8px; padding: 12px 10px 13px 14px;
  background: var(--toast-bg); color: var(--toast-fg); border: 1px solid var(--toast-line); border-left: 3px solid var(--kind, var(--toast-line)); border-radius: var(--r-2); box-shadow: var(--shadow-2);
  opacity: 0; transform: translateY(calc(var(--i, 0) * -9px + var(--ty))) scale(calc(1 - var(--i, 0) * .04)); transform-origin: 50% 100%;
  transition: transform var(--d3) var(--ease), opacity var(--d2) var(--ease);
}
.toast:not(.is-in) { --ty: 14px; }
.toast.is-in { opacity: 1; }
.toast.is-hidden { opacity: 0; pointer-events: none; }
.toast.is-out { opacity: 0; --ty: 10px; transition-duration: var(--d2); }
.toasts.is-expanded .toast { transform: translateY(calc(var(--i, 0) * (-100% - 8px))); }
.toasts.is-expanded .toast.is-hidden { opacity: 0; }
.toast--ok { --kind: var(--ok); } .toast--warn { --kind: var(--warn); } .toast--err { --kind: var(--err); } .toast--info { --kind: var(--toast-fg-2); }
.toast__body { min-width: 0; }
.toast__title { margin: 0; font-weight: 600; font-size: var(--t-sm); line-height: 1.35; }
.toast__text { margin: 3px 0 0; font-size: var(--t-xs); color: var(--toast-fg-2); line-height: 1.45; }
.toast__act { align-self: center; height: 30px; padding: 0 10px; border: 1px solid var(--toast-line); border-radius: var(--r); font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.toast__act:hover { background: var(--toast-hover); }
.toast__x { width: 28px; height: 28px; display: grid; place-items: center; color: var(--toast-fg-2); border-radius: var(--r); }
.toast__x:hover { color: var(--toast-fg); background: var(--toast-hover); }
.toast__x .ic { width: 15px; height: 15px; }
.toast__timer { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--kind, currentColor); opacity: .55; transform-origin: left; transform: scaleX(var(--p, 1)); }
.toast.is-loading .toast__title::before { content: ''; display: inline-block; width: 11px; height: 11px; margin-right: 8px; vertical-align: -1px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }

/* ---------- demo console (mockup controls, visibly outside the product) ---------- */
.dc { position: fixed; z-index: 75; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.dc__pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--dc-bg); color: var(--dc-fg); border: 1px solid var(--dc-line); font: 600 11.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; box-shadow: var(--shadow-1); }
.dc__pill .ic { width: 16px; height: 16px; }
.dc__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: dcPulse 1.8s ease-in-out infinite; }
@keyframes dcPulse { 50% { opacity: .25; } }
.dc__panel { position: absolute; left: 0; bottom: 48px; width: min(348px, calc(100vw - 32px)); max-height: min(72vh, 580px); overflow: auto; padding: 14px; display: grid; gap: 11px; background: var(--dc-bg); color: var(--dc-fg); border: 1px solid var(--dc-line); border-radius: var(--r-2); box-shadow: var(--shadow-2); }
.dc__eyebrow { margin: 0; font: 600 10.5px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dc-accent); }
.dc__note { margin: 0; font-size: 12px; color: var(--dc-fg-2); line-height: 1.5; }
.dc__row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; }
.dc__row > span:first-child { color: var(--dc-fg-2); }
.dc__btns { display: flex; flex-wrap: wrap; gap: 6px; }
.dc__btns button, .dc__seg button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--dc-line); border-radius: var(--r); font: 500 12px/1 var(--f-ui); color: var(--dc-fg); transition: background-color var(--d1) var(--ease); }
.dc__btns button:hover, .dc__seg button:hover { background: var(--dc-hover); }
.dc__seg { display: inline-flex; gap: 3px; }
.dc__seg button { padding: 0 8px; font-family: var(--f-mono); }
.dc__seg button[aria-pressed="true"], .dc__btns button[aria-pressed="true"] { background: var(--dc-fg); color: var(--dc-bg); border-color: var(--dc-fg); }
.dc__muted { font-size: 12px; color: var(--dc-fg-2); align-self: center; }
.dc .ic { width: 14px; height: 14px; }
html.is-touring .dc { opacity: 0; pointer-events: none; }
html.is-touring .toasts { bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }

/* ---------- guided tour (ghost cursor + caption) ---------- */
.tour { position: fixed; inset: 0; z-index: 95; pointer-events: none; transition: opacity var(--d2) var(--ease); }
.tour.is-out { opacity: 0; }
.tour__cursor { position: fixed; left: 0; top: 0; margin: -3px 0 0 -3px; color: var(--tour-cursor); filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); will-change: transform; }
.tour__cursor svg { display: block; }
.tour__ring { position: absolute; left: -12px; top: -12px; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
.tour__cursor.is-click .tour__ring { animation: tourClick 560ms var(--ease) both; }
@keyframes tourClick { 0% { opacity: .95; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.7); } }
.tour__cap { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(700px, calc(100vw - 24px)); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 12px 12px 16px; background: var(--tour-bg); color: var(--tour-fg); border: 1px solid var(--tour-line); border-radius: var(--r-2); box-shadow: var(--shadow-2); pointer-events: auto; }
.tour__cap.is-in { animation: capIn var(--d3) var(--ease) both; }
@keyframes capIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.tour__n { font: 600 12px/1 var(--f-mono); color: var(--tour-accent); white-space: nowrap; }
.tour__t { display: grid; gap: 2px; font-size: var(--t-sm); line-height: 1.4; }
.tour__t b { font-weight: 650; }
.tour__t span { color: var(--tour-fg-2); font-size: var(--t-xs); }
.tour__stop { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--tour-line); border-radius: var(--r); font-size: 12px; color: var(--tour-fg); white-space: nowrap; }
.tour__stop kbd { border-color: var(--tour-line); color: var(--tour-fg-2); }
@media (max-width: 600px) {
  .tour__cap { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; }
  .tour__n { grid-column: 1 / -1; }
  .tour__stop kbd { display: none; }
}

/* ---------- D650 spec layer ---------- */
html.spec-on [data-d] { outline: 1px dashed var(--spec); outline-offset: 2px; }
html.spec-on [data-d]:hover { outline: 2px solid var(--spec); }
.spec-tip { position: fixed; left: 0; top: 0; z-index: 110; max-width: 330px; padding: 10px 12px; background: var(--tip-bg); color: var(--tip-fg); border-radius: var(--r); font-size: 12px; line-height: 1.4; pointer-events: none; box-shadow: var(--shadow-2); }
.spec-tip p { margin: 0 0 4px; }
.spec-tip p:last-child { margin: 0; }
.spec-tip b { font-family: var(--f-mono); font-weight: 600; color: var(--tip-hl); margin-right: 4px; }
.spec-tip i { font-style: normal; opacity: .65; }

/* ---------- reduced motion, by architecture (LAW-79) ---------- */
html.rm *, html.rm *::before, html.rm *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0ms !important; scroll-behavior: auto !important; }
@media (max-width: 600px) {
  .toasts { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
}

/* ===================================================================
   CLCT mockup — shared structure, part 2: page layouts
   =================================================================== */

/* ---------- home: board, latest bids, collected, sell ---------- */

.sellcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; margin-top: 22px; }
.sellcard { display: grid; gap: 8px; align-content: start; padding: 24px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--sheet); text-align: left; transition: border-color var(--d2) var(--ease), background-color var(--d2) var(--ease); }

/* instrument container (skins draw the inside) */

.tiles--grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 28px 20px; }

/* ---------- departments ---------- */

.stats dt { font: 500 var(--t-label, 11px)/1.3 var(--label-font, var(--f-mono)); letter-spacing: var(--label-track, .08em); text-transform: uppercase; color: var(--fg-3); }
.stats dd { margin: 0; font: var(--stat-font); font-variant-numeric: tabular-nums; }
.stats--hero { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.stats--hero dd { font-size: clamp(24px, 2.6vw, 36px); }

.stats__s { margin: 0; font-size: var(--t-xs); color: var(--fg-3); }
.grid2 { display: grid; gap: 40px; grid-template-columns: minmax(0, 1fr); }

.artistlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); column-gap: 28px; border-top: 1px solid var(--line-2); }
.artistlist a { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; transition: color var(--d2) var(--ease); }

.bios { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 0 28px; margin: 0; }

.rel { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 7px; }
.rel li { display: grid; grid-template-columns: minmax(130px, 260px) minmax(0, 1fr) 48px; gap: 12px; align-items: center; font-size: var(--t-sm); }

@media (max-width: 600px) { .rel li { grid-template-columns: minmax(0, 1fr) 44px; } .rel__bar { grid-column: 1 / -1; grid-row: 2; } }

/* ---------- market ---------- */
.ch { width: 100%; height: auto; display: block; overflow: visible; }
.ch__grid { stroke: var(--line); stroke-width: 1; }
.ch__tick, .ch__lbl, .ch__val, .ch__in { font: 11px var(--f-mono); fill: var(--fg-3); }

.cat1 { fill: var(--cat1); } .cat2 { fill: var(--cat2); } .cat3 { fill: var(--cat3); } .cat4 { fill: var(--cat4); } .cat5 { fill: var(--cat5); } .cat6 { fill: var(--cat6); }
.sw.cat1 { background: var(--cat1); } .sw.cat2 { background: var(--cat2); } .sw.cat3 { background: var(--cat3); } .sw.cat4 { background: var(--cat4); } .sw.cat5 { background: var(--cat5); } .sw.cat6 { background: var(--cat6); }
.seq0 { fill: var(--seq0); } .seq1 { fill: var(--seq1); } .seq2 { fill: var(--seq2); } .seq3 { fill: var(--seq3); } .seq4 { fill: var(--seq4); } .seq5 { fill: var(--seq5); } .seq6 { fill: var(--seq6); } .seq7 { fill: var(--seq7); } .seq8 { fill: var(--seq8); }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; font-size: var(--t-xs); color: var(--fg-2); }

.sw { width: 10px; height: 10px; display: inline-block; flex: none; }
.days { display: grid; gap: 30px; }
.day__h { margin: 0 0 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line-2); font: var(--h4-font, 600 var(--t-md)/1.3 var(--f-ui)); }
.day__l { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); column-gap: 26px; }

.sale figure { margin: 0; width: 56px; height: 56px; background: var(--bg-2); display: grid; place-items: center; overflow: hidden; }
.sale figure > * { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
.sale__t { margin: 0 0 4px; font-weight: 500; font-size: var(--t-sm); line-height: 1.3; }
.sale__m { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: var(--t-xs); }

/* ---------- media & article ---------- */
.feat { display: grid; grid-template-columns: minmax(0, 1fr); text-decoration: none; border: 1px solid var(--line-2); background: var(--sheet); margin: 0 0 30px; transition: border-color var(--d2) var(--ease); }

.feat__t { margin: 0; font: var(--feat-font); letter-spacing: var(--h-track, -.01em); transition: color var(--d2) var(--ease); }

.topics { margin: 0 0 6px; }

.story__t { margin: 0; font: var(--h3-font); transition: color var(--d2) var(--ease); }

.story a:hover .story__t { color: var(--accent-ink); }
.story .lnk, .feat .lnk { margin: 0; }
.art { display: grid; gap: 30px; margin-top: 4px; }
.art__hd { display: grid; gap: 14px; max-width: 900px; }
.art__hd .crumbs { margin: 18px 0 4px; }
.art__t { margin: 0; font: var(--art-t-font); letter-spacing: var(--h-track, -.015em); }
.art__dek { margin: 0; font-size: var(--t-lg); color: var(--fg-2); max-width: 62ch; line-height: 1.5; }

.art__hero { margin: 0; }
.art__hero img { width: 100%; max-height: 72vh; object-fit: cover; }

.art__grid { display: grid; gap: 44px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1040px) { .art__grid { grid-template-columns: minmax(0, 700px) 300px; justify-content: space-between; } .art__rail { position: sticky; top: calc(var(--hd-h) + 20px); } }
.art__body { font: var(--art-body-font, 400 18px/1.72 var(--f-ui)); max-width: 68ch; }
.art__body > p { margin: 0 0 1.15em; }
.art__fig { margin: 1.6em 0; }
.art__fig img { width: 100%; }
.art__more { padding: 14px 16px; background: var(--bg-2); font-size: var(--t-sm); }

.art__rail { display: grid; gap: 24px; align-content: start; }

/* ---------- guide ---------- */

@media (min-width: 1000px) { .guide { grid-template-columns: 210px minmax(0, 1fr); gap: 56px; } .guide__rail { position: sticky; top: calc(var(--hd-h) + 20px); align-self: start; } .guide__rail ol { flex-direction: column; } }
.guide__rail ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }

.numbered { list-style: none; margin: 18px 0; padding: 0; display: grid; gap: 16px; }

@media (min-width: 720px) { .calc { grid-template-columns: 240px minmax(0, 1fr); } .calc .ledgerx { margin-top: 0; } }
.cta2 { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0; }

/* ---------- sell ---------- */
.ticks { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: var(--t-sm); color: var(--fg-2); }

.thumbs { list-style: none; margin: 14px 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }

.acct__meta { margin: 0; font-size: 12px; color: var(--fg-3); }
.acct { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .acct { grid-template-columns: 220px minmax(0, 1fr); gap: 48px; } .acct__nav ul { flex-direction: column; } }
.acct__nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.acct__nav a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; text-decoration: none; color: var(--fg-2); border-left: 2px solid transparent; white-space: nowrap; font-size: var(--t-sm); transition: color var(--d2) var(--ease), background-color var(--d2) var(--ease); }
.acct__nav a:hover { color: var(--fg); background: var(--bg-2); }
.acct__nav a[aria-current] { color: var(--fg); border-left-color: var(--accent); background: var(--bg-2); font-weight: 600; }
.acct__n { font: 12px var(--f-mono); color: var(--fg-3); }
.acct__body { min-width: 0; }
.acct__body > .sh__t { margin: 30px 0 12px; font: var(--h3-font); }
.acct__body > .sh__t:first-child { margin-top: 0; }
.alist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line-2); }
.arow > a, .arow__a { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); text-decoration: none; transition: background-color var(--d2) var(--ease); }
.arow > a:hover { background: var(--bg-2); }
.arow__a { grid-template-columns: minmax(0, 1fr); }
.arow img { width: 52px; height: 52px; object-fit: contain; background: var(--bg-2); }
.arow__t { display: grid; gap: 2px; min-width: 0; }
.arow__t b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow__t .muted { font-size: var(--t-xs); }
.arow__p { font-weight: 600; }
.arow__c { font-size: 12px; color: var(--fg-3); min-width: 50px; text-align: right; }
.arow.is-hot .arow__c { color: var(--hot-ink); font-weight: 600; }
@media (max-width: 560px) { .arow > a { grid-template-columns: 44px minmax(0, 1fr) auto; } .arow img { width: 44px; height: 44px; } .arow__c, .arow > a > .pill { grid-column: 3; } }
.settings { display: grid; gap: 6px; max-width: 540px; }

/* ---------- invoice & pay ---------- */
.inv { display: grid; gap: 36px; grid-template-columns: minmax(0, 1fr); margin-top: 4px; }
@media (min-width: 1000px) { .inv { grid-template-columns: minmax(0, 1.1fr) minmax(330px, .9fr); gap: 56px; } }
.inv__l { display: grid; gap: 16px; align-content: start; min-width: 0; }
.inv__hd { display: grid; gap: 10px; }
.inv__hd .eyebrow { margin: 0; }
.inv__lot { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; }
.inv__lot > img, .inv__lot > .nophoto { width: 72px; height: 72px; object-fit: contain; background: var(--bg-2); }
.inv__lot p { margin: 0; }
.ledgerx--inv > div { padding: 12px 0; font-size: var(--t-md); }
.inv__r { min-width: 0; }
.pay { display: grid; gap: 12px; padding: clamp(16px, 2.6vw, 28px); border: 1px solid var(--line-2); background: var(--sheet); }
.pay > .eyebrow { margin: 0; }
.pay .note { margin: 0; }
.quote { display: grid; gap: 12px; }
.quote .eyebrow { margin: 0; }
.quote__amt { margin: 0; font: 600 clamp(26px, 3.4vw, 38px)/1.1 var(--f-mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.quote__amt span { font-size: .45em; color: var(--fg-3); font-weight: 500; letter-spacing: .02em; }
.hold { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 10px; font-size: var(--t-sm); }
.hold__lbl { color: var(--fg-3); }
.hold__bar { position: relative; display: block; height: 4px; background: var(--bg-3); overflow: hidden; }
.hold__bar > i { position: absolute; inset: 0; background: var(--fg); transform-origin: left; }
.qr { margin: 0; display: grid; justify-items: center; gap: 8px; padding: 12px; background: var(--bg-2); }
.qr__cv { width: 232px; height: 232px; max-width: 100%; image-rendering: pixelated; }
.qr figcaption { font: 600 11px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--err); }
.copyrow { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; background: var(--bg-2); min-width: 0; }
.copyrow code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.conf { display: grid; gap: 12px; }
.conf .eyebrow, .settled .eyebrow { margin: 0; }
.conf .sh__t, .settled .sh__t { font: var(--h3-font); }
.conf__l { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.conf__l li { display: grid; gap: 6px; justify-items: center; font-size: 10px; color: var(--fg-3); text-align: center; }
.conf__l li > .mono { width: 100%; height: 38px; display: grid; place-items: center; border: 1px solid var(--line-2); font-size: 13px; color: var(--fg-3); transition: background-color var(--d3) var(--ease), color var(--d3) var(--ease), border-color var(--d3) var(--ease); }
.conf__l li.is-on > .mono { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.conf__l li.is-on.is-prov > .mono { background: var(--warn); border-color: var(--warn); color: var(--on-warn, #fff); }
.conf__l li.is-on.is-final > .mono { background: var(--ok); border-color: var(--ok); color: var(--on-ok, #fff); }
.settled { display: grid; gap: 12px; }
.receipt { margin: 0; display: grid; gap: 8px; }
.receipt canvas { width: min(320px, 100%); height: auto; aspect-ratio: 1; }
.receipt figcaption { font-size: var(--t-xs); color: var(--fg-3); max-width: 46ch; }
.settled .btn { justify-self: start; }

/* ---------- search, marks, ledger ---------- */
.sres { list-style: none; margin: 16px 0; padding: 0; border-top: 1px solid var(--line-2); }
.sres a { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); text-decoration: none; align-items: center; }
.sres a:hover b { color: var(--accent-ink); }
.sres .tag { grid-row: span 2; }
.sres .muted { font-size: var(--t-xs); }
.marks { list-style: none; margin: 22px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 148px), 1fr)); gap: 16px 14px; }
.marks__i button { display: grid; gap: 6px; width: 100%; text-align: left; }
.marks__i img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--bg-2); }
.marks__n { font-size: 11px; color: var(--fg-3); }
.marks__t { font-size: var(--t-sm); font-weight: 500; transition: color var(--d2) var(--ease); }
.marks__i button:hover .marks__t { color: var(--accent-ink); }
.markview .ov__panel { width: min(660px, 100%); }
.mv { margin: 0; display: grid; gap: 10px; }
.mv img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--bg-2); }
.mv figcaption { font-size: var(--t-sm); }
.mv__nav { display: flex; justify-content: space-between; margin-top: 10px; }
.reg { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); column-gap: 26px; }
.reg li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: var(--t-sm); }
.reg b { font-size: 12px; font-weight: 600; }
.reg em { grid-column: 2; font-style: normal; font-size: var(--t-xs); color: var(--fg-3); }

/* ---------- skin-shared shell basics ---------- */
.hd { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; }
.ft { margin-top: 0; }

.ph + .sec, .ph + .wiz, .tabs + .sec, .ph + .cat { margin-top: clamp(20px, 3vw, 36px); }

/* ===================================================================
   Styling B — "Thermal". A dark instrument: the auction read as temperature.
   Every heat colour comes from the fourteen-stop CAP-346 ramp; the live colour is
   its peak pink (one brand hue, LAW-59); focus is signal yellow. Sans-only
   instrument register (LAW-85): Archivo across its width axis, Martian Mono for figures.
   =================================================================== */
:root {
  color-scheme: dark;
  --bg: #07080A; --bg-2: #0E1013; --bg-3: #171A1F; --sheet: #0C0D10; --field: #0A0B0E;
  --fg: #F2F3F5; --fg-2: #B8BCC3; --fg-3: #8A8F97; --fg-4: #5B6068;
  --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .15); --line-3: rgba(255, 255, 255, .34);
  --t-navy: #021358; --t-blue: #0D6CC1; --t-cyan: #21B6F7; --t-ice: #8EDEFE; --t-cream: #E5CDA8; --t-amber: #E79332; --t-red: #E63718; --t-pink: #FB55AA; --t-lilac: #FEA8F6; --t-white: #FFFFFF;
  --heat-grad: linear-gradient(90deg, #0D6CC1, #21B6F7 18%, #8EDEFE 32%, #E5CDA8 46%, #E79332 60%, #E63718 74%, #FB55AA 88%, #FEA8F6);
  --heat-text: linear-gradient(90deg, #21B6F7, #8EDEFE 22%, #E79332 52%, #E63718 72%, #FB55AA 88%, #FEA8F6);
  --accent: #FB55AA; --accent-ink: #FF86C6; --accent-fg: #07080A;
  --live: #FB55AA; --live-ink: #FF86C6;
  --hot: #E63718; --hot-ink: #FF8A5E; --hot-tint: rgba(230, 55, 24, .16);
  --you: #8EDEFE; --flash: #FEA8F6; --new-bg: rgba(251, 85, 170, .12);
  --ok: #27AD75; --warn: #E79332; --err: #FF4B3A; --focus: #FFDD00; --btc: #F7931A;
  --on-ok: #07080A; --on-warn: #07080A;
  --chrome: #07080A; --chrome-2: #0B0C0F; --chrome-fg: #F2F3F5; --chrome-fg-2: #8A8F97; --chrome-line: rgba(255, 255, 255, .09); --chrome-hover: rgba(255, 255, 255, .06);
  --btn: #F2F3F5; --btn-h: #FFFFFF; --btn-fg: #07080A;
  --scrim: rgba(2, 3, 5, .72);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .45);
  --shadow-2: 0 2px 8px rgba(0, 0, 0, .55), 0 26px 70px rgba(0, 0, 0, .65);
  --glow: 0 0 0 1px rgba(251, 85, 170, .35), 0 0 24px rgba(251, 85, 170, .18);
  --sel: rgba(251, 85, 170, .35);
  --toast-bg: #121418; --toast-fg: #F2F3F5; --toast-fg-2: #9CA1A9; --toast-line: rgba(255, 255, 255, .12); --toast-hover: rgba(255, 255, 255, .07);
  --dc-bg: #0E1013; --dc-fg: #F2F3F5; --dc-fg-2: #8A8F97; --dc-line: rgba(255, 255, 255, .14); --dc-hover: #171A1F; --dc-accent: #FFDD00;
  --tour-bg: #F2F3F5; --tour-fg: #07080A; --tour-fg-2: #4A4F57; --tour-line: rgba(7, 8, 10, .18); --tour-accent: #E63718; --tour-cursor: #F2F3F5; --tour-cursor-edge: #07080A;
  --tip-bg: #F2F3F5; --tip-fg: #07080A; --tip-hl: #C2185B; --spec: #FFDD00;
  --cat1: #21B6F7; --cat2: #FB55AA; --cat3: #E79332; --cat4: #E63718; --cat5: #8EDEFE; --cat6: #FEA8F6; --ch-in: #07080A;
  --seq0: #032378; --seq1: #084195; --seq2: #0D6CC1; --seq3: #1194E3; --seq4: #21B6F7; --seq5: #E79332; --seq6: #E63718; --seq7: #FB55AA; --seq8: #FEA8F6;
  --scan: rgba(255, 255, 255, .025);

  --f-ui: 'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-display: 'Archivo', ui-sans-serif, system-ui, sans-serif;
  --f-serif: var(--f-display);
  --f-mono: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --label-font: var(--f-mono); --t-label: 9.5px; --label-track: .12em;
  --h-track: -.005em;
  --h2-font: 800 var(--t-2xl)/1 var(--f-display);
  --h3-font: 700 var(--t-lg)/1.2 var(--f-display);
  --h4-font: 700 var(--t-sm)/1.3 var(--f-mono);
  --ph-font: 900 clamp(38px, 6.4vw, 92px)/.9 var(--f-display); --ph-track: -.02em;
  --lot-maker-font: 900 clamp(38px, 4.6vw, 66px)/.92 var(--f-display);
  --lot-t-font: italic 300 clamp(22px, 2.3vw, 32px)/1.1 var(--f-display);
  --price-font: 500 clamp(28px, 3vw, 38px)/1 var(--f-mono);
  --stat-font: 500 var(--t-2xl)/1.05 var(--f-mono);
  --tile-t-font: 700 var(--t-md)/1.25 var(--f-display);
  --feat-font: 900 clamp(26px, 3.2vw, 44px)/.98 var(--f-display);
  --art-t-font: 900 clamp(34px, 5.2vw, 70px)/.95 var(--f-display);
  --art-body-font: 400 18px/1.72 var(--f-ui);
  --btn-font: 700 12px/1 var(--f-ui); --btn-track: .1em; --btn-case: uppercase;
  --tab-font: 700 12px/1 var(--f-ui); --tab-track: .1em; --tab-case: uppercase; --tab-ind: var(--heat-grad);
  --r: 3px; --r-2: 6px; --r-pill: 999px;
  --ease: cubic-bezier(.16, 1, .3, 1); --ease-money: cubic-bezier(.16, 1, .3, 1);
  --d1: 140ms; --d2: 240ms; --d3: 400ms; --d4: 700ms;
  --hd-h: 92px;
}

    color-scheme: light;
    --bg: #F4F4F2; --bg-2: #EAEAE6; --bg-3: #DFDFDA; --sheet: #FFFFFF; --field: #FFFFFF;
    --fg: #0B0C0E; --fg-2: #3A3E45; --fg-3: #60656D; --fg-4: #8E939A;

    --accent: #FB55AA; --accent-ink: #B3176F; --accent-fg: #FFFFFF; --live: #E6338F; --live-ink: #B3176F;

    --you: #0D6CC1; --flash: #B3176F; --new-bg: rgba(251, 85, 170, .14);
    --ok: #157A52; --warn: #A65A00; --err: #C42A1A; --focus: #2B4BFF; --on-ok: #FFFFFF; --on-warn: #FFFFFF;
    --chrome: #0B0C0E; --chrome-2: #141519; --chrome-fg: #F2F3F5; --chrome-fg-2: #9CA1A9; --chrome-line: rgba(255, 255, 255, .1); --chrome-hover: rgba(255, 255, 255, .07);
    --btn: #0B0C0E; --btn-h: #26282D; --btn-fg: #F4F4F2;
    --scrim: rgba(11, 12, 14, .45);
    --shadow-1: 0 1px 2px rgba(11, 12, 14, .08), 0 6px 18px rgba(11, 12, 14, .08);
    --shadow-2: 0 2px 6px rgba(11, 12, 14, .08), 0 22px 56px rgba(11, 12, 14, .2);
    --glow: 0 0 0 1px rgba(230, 51, 143, .3), 0 0 18px rgba(230, 51, 143, .12);
    --sel: rgba(251, 85, 170, .25);
    --toast-bg: #0B0C0E; --toast-fg: #F2F3F5; --toast-fg-2: #A9AEB5; --toast-line: rgba(255, 255, 255, .14); --toast-hover: rgba(255, 255, 255, .08);
    --dc-bg: #FFFFFF; --dc-fg: #0B0C0E; --dc-fg-2: #60656D; --dc-line: rgba(11, 12, 14, .16); --dc-hover: #EAEAE6; --dc-accent: #B3176F;
    --tour-bg: #0B0C0E; --tour-fg: #F2F3F5; --tour-fg-2: #A9AEB5; --tour-line: rgba(255, 255, 255, .2); --tour-accent: #FFDD00; --tour-cursor: #0B0C0E; --tour-cursor-edge: #FFFFFF;
    --tip-bg: #0B0C0E; --tip-fg: #F2F3F5; --tip-hl: #FFDD00; --spec: #2B4BFF;
    --cat1: #0D6CC1; --cat2: #E6338F; --cat3: #D9821F; --cat4: #E63718; --cat5: #21B6F7; --cat6: #B3176F; --ch-in: #FFFFFF;
    --seq0: #8EDEFE; --seq1: #21B6F7; --seq2: #1194E3; --seq3: #0D6CC1; --seq4: #E79332; --seq5: #E63718; --seq6: #E6338F; --seq7: #B3176F; --seq8: #021358;
    --scan: rgba(11, 12, 14, .03);
  }
}

body { background: var(--bg); color: var(--fg); font-stretch: 100%; }
/* a faint scanline tile, never regenerated (LAW-166) */
body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px); }
body > * { position: relative; z-index: 1; }
body > .hd { z-index: 50; }
.logo { fill: currentColor; }
.therm { background: var(--heat-text); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
:root[data-theme="light"] .therm { background: linear-gradient(90deg, #0D6CC1, #1194E3 25%, #D9821F 55%, #E63718 72%, #E6338F 90%); -webkit-background-clip: text; background-clip: text; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .therm { background: linear-gradient(90deg, #0D6CC1, #1194E3 25%, #D9821F 55%, #E63718 72%, #E6338F 90%); -webkit-background-clip: text; background-clip: text; } }

/* ---------- display type: Archivo across its width axis ---------- */
.ph__t, .sh__t, .gs__t, .feat__t, .art__t, .lot__maker, .hero__t, .hm__lead h3, .sec--sell > .sh__t { font-stretch: 125%; text-transform: uppercase; }
.ph__t { letter-spacing: -.015em; }
.ph__t--serif { font-stretch: 112%; text-transform: none; font-weight: 800; }
.sh__t { font-weight: 800; letter-spacing: 0; }
.lotinfo .sh__t, .acct__body > .sh__t, .conf .sh__t, .settled .sh__t, .wiz__body > .sh__t, .sub { font-stretch: 112%; }
.lot__title, .lot__maker .lot__title { font-stretch: 100%; text-transform: none; }
.art__t { text-transform: none; font-stretch: 112%; }
.tile__t, .story__t, .lbp__t, .sale__t, .collected__t, .salon__t, .review__t, .arow__t b { font-stretch: 106%; }
.eyebrow, .lbl, .crumbs, .count, .field > label, .fs > legend, .facts dt, .stats dt, .tbl th, .mini dt, .rules dt { font-stretch: 100%; }
.price__v, .stats dd, .quote__amt { font-stretch: 87.5%; letter-spacing: -.03em; }

/* ---------- header: a status rail over an instrument bar ---------- */
.hd { background: var(--chrome); color: var(--chrome-fg); border-bottom: 1px solid var(--chrome-line); }
.hd__in { width: min(100% - 2 * var(--gut), var(--maxw)); margin-inline: auto; }
.hd__rail { background: var(--chrome-2); border-bottom: 1px solid var(--chrome-line); }
.hd__rail .hd__in { display: flex; align-items: center; gap: 18px; height: 30px; font: 400 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--chrome-fg-2); white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.hd__rail b { color: var(--chrome-fg); font-weight: 500; }
.hd__rec { display: inline-flex; align-items: center; gap: 7px; color: var(--chrome-fg); }
.hd__rec i { width: 7px; height: 7px; border-radius: 50%; background: var(--t-pink); box-shadow: 0 0 10px var(--t-pink); animation: recPulse 1.6s ease-in-out infinite; }
@keyframes recPulse { 50% { opacity: .35; } }
.hd__rail .hd__sp { margin-left: auto; }
.hd__util { display: flex; align-items: center; gap: 2px; margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--chrome-line); }

.hd__up { color: #27AD75; } .hd__dn { color: #FF4B3A; }
.hd__bar .hd__in { display: flex; align-items: center; gap: 18px; height: 61px; }
.hd__logo { position: relative; flex: none; display: block; width: 112px; height: 34px; color: var(--chrome-fg); }
.hd__logo canvas { position: absolute; inset: -6px -8px; width: calc(100% + 16px); height: calc(100% + 12px); }
.hd__logo .logo { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
.hd__nav { display: flex; align-items: center; gap: 2px; min-width: 0; }
.hd__nav a { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 11px; border-radius: var(--r); text-decoration: none; color: var(--chrome-fg-2); font: 700 11.5px/1 var(--f-ui); font-stretch: 112%; letter-spacing: .09em; text-transform: uppercase; white-space: nowrap; transition: color var(--d2) var(--ease), background-color var(--d2) var(--ease), opacity var(--d2) var(--ease); }
.hd__nav:hover a:not(:hover) { opacity: .62; }
.hd__nav a:hover { color: var(--chrome-fg); background: var(--chrome-hover); }
.hd__nav a[aria-current="page"] { color: var(--chrome-fg); }
.hd__nav a[aria-current="page"]::after { content: ''; position: absolute; left: 11px; right: 11px; bottom: -13px; height: 2px; background: var(--heat-grad); }
.hd__nav .hd__box { color: var(--chrome-fg); box-shadow: inset 0 0 0 1px var(--chrome-fg-2); }
.hd__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--t-pink); box-shadow: 0 0 8px var(--t-pink); }
.hd__n { font: 500 10px/1 var(--f-mono); padding: 3px 5px; border-radius: 3px; background: rgba(251, 85, 170, .16); color: #FF86C6; }
.hd__right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.hd__search { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; min-width: 210px; border: 1px solid var(--chrome-line); border-radius: var(--r); color: var(--chrome-fg-2); font: 500 12px/1 var(--f-ui); transition: border-color var(--d2) var(--ease), color var(--d2) var(--ease); }
.hd__search:hover { border-color: var(--chrome-fg-2); color: var(--chrome-fg); }
.hd__search span { flex: 1; text-align: left; }
.hd__search kbd { border-color: var(--chrome-line); color: var(--chrome-fg-2); }
.hd__search .ic { width: 16px; height: 16px; }
.hd__acct { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 6px; border-radius: 999px; border: 1px solid var(--chrome-line); text-decoration: none; color: var(--chrome-fg); font: 500 11px/1 var(--f-mono); }
.hd__acct i { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFFFFF, #FEA8F6 18%, #FB55AA 34%, #E63718 52%, #E79332 66%, #21B6F7 84%, #021358); }
.hd__acct[aria-current="page"] { border-color: var(--chrome-fg-2); }
.hd__menu, .hd__msearch { display: none; width: 42px; height: 42px; place-items: center; color: var(--chrome-fg); border-radius: var(--r); }
.hd__menu .ic, .hd__msearch .ic { width: 22px; height: 22px; }
@media (max-width: 1240px) { .hd__search span, .hd__search kbd { display: none; } .hd__search { min-width: 0; width: 38px; justify-content: center; padding: 0; } .hd__nav a { padding: 0 8px; letter-spacing: .06em; } }
@media (max-width: 1100px) { .hd__nav a[data-dept="collectibles"], .hd__rail .hd__opt { display: none; } }
@media (max-width: 1000px) { .hd__util { display: none; } }
@media (max-width: 920px) {
  :root { --hd-h: 86px; }
  .hd__nav, .hd__search, .hd__acct { display: none; }
  .hd__menu, .hd__msearch { display: grid; }
  .hd__bar .hd__in { height: 55px; }
  .hd__rail .hd__in { gap: 12px; }
  .hd__rail .hd__opt2 { display: none; }
}
.mnav { display: grid; gap: 22px; }
.mnav ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line-2); }
.mnav li a { display: flex; justify-content: space-between; align-items: center; padding: 15px 2px; border-bottom: 1px solid var(--line); text-decoration: none; font: 800 var(--t-lg)/1.1 var(--f-display); font-stretch: 118%; text-transform: uppercase; letter-spacing: .02em; }
.mnav li a[aria-current="page"] { color: var(--accent-ink); }
.mnav .eyebrow { margin: 0 0 6px; }
.mnav__meta { display: grid; gap: 6px; font: 11px var(--f-mono); color: var(--fg-3); }

/* ---------- channel strip (slug line) ---------- */
.slugline { border-bottom-color: var(--line); color: var(--fg-3); font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .1em; }
.slugline > span:nth-of-type(1) { color: var(--fg); }
.ch-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--t-pink); box-shadow: 0 0 10px var(--t-pink); flex: none; }
.ramp { display: inline-block; width: 120px; height: 8px; border-radius: 2px; background: var(--heat-grad); flex: none; }

/* ---------- footer: isotherms of the mark ---------- */
.ft { background: var(--bg); border-top: 1px solid var(--line); padding: 0 0 calc(80px + env(safe-area-inset-bottom, 0px)); }
.ft__heat { position: relative; width: min(100% - 2 * var(--gut), var(--maxw)); margin: 0 auto; padding: 34px 0 0; }
.ft__cv { display: block; width: 100%; height: clamp(110px, 16vw, 220px); }
.ft__scale { display: flex; align-items: center; gap: 12px; margin: 12px 0 0; font: 400 9.5px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }
.ft__scale .ramp { flex: 1; max-width: 360px; }
.ft__cols { width: min(100% - 2 * var(--gut), var(--maxw)); margin: 30px auto 0; display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); padding-top: 26px; border-top: 1px solid var(--line); }
.ft__brand { grid-column: span 2; display: grid; gap: 12px; align-content: start; max-width: 380px; }
@media (max-width: 560px) { .ft__brand { grid-column: 1 / -1; } }
.ft__brand p { margin: 0; color: var(--fg-2); font-size: var(--t-sm); }
.ft__brand .btn { justify-self: start; }
.ft__cols ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: var(--t-sm); }
.ft__cols a { text-decoration: none; color: var(--fg-2); transition: color var(--d2) var(--ease); }
.ft__cols a:hover { color: var(--fg); }
.ft__cols .ic { width: 12px; height: 12px; vertical-align: -1px; margin-left: 3px; opacity: .6; }
.ft__base { width: min(100% - 2 * var(--gut), var(--maxw)); margin: 30px auto 0; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; font-size: var(--t-xs); color: var(--fg-3); }
.ft__base p { margin: 0; }
.ft__base a { color: var(--fg-2); }
.ft__base .mono { letter-spacing: .06em; text-transform: uppercase; font-size: 10px; }
.ft__colo { max-width: 92ch; margin: 14px max(var(--gut), calc((100% - var(--maxw)) / 2)) 0; font-size: var(--t-xs); color: var(--fg-3); }
.ft__colo a { color: var(--fg-2); }

/* ---------- home hero: the monitor and the headline ---------- */
.hero { margin-top: 28px; display: grid; gap: clamp(26px, 4vw, 56px); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1000px) { .hero { grid-template-columns: minmax(320px, 520px) minmax(0, 1fr); } }
@media (max-width: 999px) { .hero__copy { order: -1; } .mon { max-width: 560px; } }
.mon { margin: 0; display: grid; gap: 0; border: 1px solid var(--line-2); border-radius: var(--r-2); background: var(--sheet); overflow: hidden; box-shadow: 0 0 0 1px rgba(0, 0, 0, .3), 0 30px 80px -30px var(--mark-glow, rgba(251, 85, 170, .4)); transition: box-shadow var(--d4) var(--ease); }
.mon__bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); font: 400 9.5px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }
.mon__bar b { color: var(--fg); font-weight: 500; }
.mon__screen { position: relative; aspect-ratio: 1; background: #000; }
.mon__cv { display: block; width: 100%; height: 100%; }
.mon__screen::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .14) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
.mon__corner { position: absolute; width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, .7); z-index: 1; pointer-events: none; }
.mon__corner--tl { left: 10px; top: 10px; border-right: 0; border-bottom: 0; } .mon__corner--tr { right: 10px; top: 10px; border-left: 0; border-bottom: 0; }
.mon__corner--bl { left: 10px; bottom: 10px; border-right: 0; border-top: 0; } .mon__corner--br { right: 10px; bottom: 10px; border-left: 0; border-top: 0; }
.mon__open { position: absolute; inset: 0; z-index: 2; }
.mon__open:focus-visible { outline-offset: -4px; }
.mon__read { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 12px 14px 4px; }
.mon__ch { font: 500 11px/1 var(--f-mono); color: var(--fg-3); letter-spacing: .04em; }
.mon__ch b { color: var(--fg); font-weight: 600; }
.mon__name { font: 900 var(--t-lg)/1 var(--f-display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mon__tr { font: 400 9.5px/1 var(--f-mono); color: var(--accent-ink); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.mon__fam { grid-column: 2 / 4; font: 400 9.5px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }
.mon__ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px 14px; }
.mon__btn { width: 36px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: var(--r); color: var(--fg-2); transition: border-color var(--d2) var(--ease), color var(--d2) var(--ease); }
.mon__btn:hover { border-color: var(--fg-2); color: var(--fg); }
.mon__btn .ic { width: 16px; height: 16px; }
.mon__ctl .seg { margin-left: auto; }
.mon__dwell { position: relative; display: block; flex: 1 0 100%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 2px; }
.mon__dwell > i { position: absolute; inset: 0; background: var(--heat-grad); transform-origin: left; transform: scaleX(0); }
.hero__copy { display: grid; gap: 20px; align-content: start; min-width: 0; padding-top: 4px; }
.hero__copy > .eyebrow { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; color: var(--fg-2); }
.hero__copy > .eyebrow .ch-dot { width: 7px; height: 7px; }
.hero__t { margin: 0; font: 900 clamp(42px, 6.6vw, 104px)/.86 var(--f-display); letter-spacing: -.025em; }
.hero__t span { display: block; }
.hero__lede { margin: 0; max-width: 52ch; font-size: var(--t-lg); color: var(--fg-2); line-height: 1.55; }
.hero__ctas { display: flex; flex-wrap: wrap; gap: 10px; }
.feature { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px; border: 1px solid var(--line-2); border-radius: var(--r-2); background: var(--sheet); }
.feature__img { display: block; aspect-ratio: 4 / 5; border-radius: var(--r); background: var(--bg-3); overflow: hidden; }
.feature__img img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.feature__txt { display: grid; gap: 9px; min-width: 0; }
.feature__txt .eyebrow { margin: 0; color: var(--accent-ink); }
.feature__t { margin: 0; font: 800 var(--t-lg)/1.15 var(--f-display); font-stretch: 112%; text-transform: uppercase; }
.feature__t em { font-style: italic; font-weight: 300; text-transform: none; font-stretch: 100%; color: var(--fg-2); }
.feature__kv { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; }
.feature__kv > div { display: grid; gap: 4px; }
.feature__kv dt { font: 400 9px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }
.feature__kv dd { margin: 0; font: 500 var(--t-lg)/1 var(--f-mono); font-stretch: 87.5%; font-variant-numeric: tabular-nums; }
.feature.is-hot .feature__clk { color: var(--hot-ink); }
.feature .btn { justify-self: start; }
.feature__heat { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.feature__heat i { display: block; height: 100%; width: calc(var(--f, 0) * 100%); background: var(--heat-grad); background-size: calc(100% / max(var(--f, .01), .01)) 100%; }

/* ---------- lot cards: thermal tiles with a heat slab ---------- */
.board { --card-min: 250px; }
.board:hover .tc:not(:hover), .tiles--grid:hover .tile:not(:hover), .stories:hover .story:not(:hover), .salon:hover .salon__i:not(:hover), .marks:hover .marks__i:not(:hover) { opacity: .5; }
.tc, .tile, .story, .salon__i, .marks__i { transition: opacity var(--d2) var(--ease); }
.tc { position: relative; display: grid; align-content: start; gap: 0; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--sheet); overflow: hidden; }
.tc__fig { position: relative; display: block; aspect-ratio: 1 / 1; background: var(--bg-3); overflow: hidden; }
.tc__fig > img, .tc__fig > .nophoto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 7%; }
.tc__state { position: absolute; left: 10px; top: 10px; z-index: 1; }
.tc__state.pill { background: rgba(7, 8, 10, .72); backdrop-filter: blur(4px); }
.tc__lot { position: absolute; right: 10px; top: 12px; font: 500 9.5px/1 var(--f-mono); letter-spacing: .1em; color: rgba(255, 255, 255, .8); text-shadow: 0 1px 2px #000; }
.tc__sold { position: absolute; inset: auto 0 0 0; padding: 8px 10px; font: 900 13px/1 var(--f-display); font-stretch: 125%; letter-spacing: .14em; text-transform: uppercase; color: #07080A; background: var(--heat-grad); }
.tc__sold--un { background: var(--bg-3); color: var(--fg-3); }
.tc__body { display: grid; gap: 8px; padding: 14px 14px 12px; }
.tc__k { margin: 0; font: 400 9.5px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }
.tc__t { margin: 0; font: 800 var(--t-md)/1.15 var(--f-display); font-stretch: 118%; text-transform: uppercase; }
.tc__t a { text-decoration: none; }
.tc__t a::after { content: ''; position: absolute; inset: 0; z-index: 1; }
.tc__s { margin: -4px 0 0; font: italic 300 var(--t-sm)/1.3 var(--f-display); color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc__nums { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.tc__nums > div { display: grid; gap: 5px; min-width: 0; }
.tc__nums b { font: 500 var(--t-lg)/1 var(--f-mono); font-stretch: 87.5%; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tc__btc { font: 400 10px/1 var(--f-mono); color: var(--fg-3); }
.tc__clk { text-align: right; justify-items: end; }
.tc.is-hot .tc__clk b { color: var(--hot-ink); text-shadow: 0 0 14px rgba(230, 55, 24, .55); }
.tc.is-closed .tc__clk b { color: var(--fg-3); }
.tc__slab { position: relative; height: 6px; border-radius: 3px; background: var(--bg-3); overflow: hidden; }
.tc__slab i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--f, 0) * 100%); background: var(--heat-grad); background-size: calc(100% / max(var(--f, .01), .01)) 100%; }
.tc__hz { margin: 0; font: 400 9.5px/1.4 var(--f-mono); letter-spacing: .04em; color: var(--hot-ink); display: none; }
.tc.is-hot .tc__hz { display: block; }
.tc:hover { border-color: var(--line-3); }
.tc:hover .tc__t a, .tc__t a:focus-visible { color: var(--accent-ink); }

/* ---------- auctions: mempool-style slabs ---------- */
.slabs { margin: 0 0 32px; padding: 16px 16px 6px; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--sheet); }
.slabs__hd { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin: 0 0 14px; }
.slabs__hd .eyebrow { margin: 0; color: var(--fg); }
.slabs__hd p:last-child { margin: 0; font: 400 9.5px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.slabs__row { list-style: none; margin: 0; padding: 18px 4px 12px; display: flex; gap: 22px; overflow-x: auto; scrollbar-width: thin; }
.slab { flex: none; width: 128px; }
.slab a { display: grid; gap: 10px; text-decoration: none; }
.slab__cube { position: relative; display: grid; align-content: space-between; aspect-ratio: 1; padding: 10px; border-radius: 2px; background: var(--bg-3); overflow: visible; transform-style: preserve-3d; }
.slab__cube::before { content: ''; position: absolute; left: 6px; right: -6px; top: -12px; height: 12px; background: color-mix(in srgb, var(--slab-c, #21B6F7) 55%, var(--bg-3)); transform: skewX(-26deg); transform-origin: bottom left; border-radius: 2px 2px 0 0; opacity: .9; }
.slab__cube::after { content: ''; position: absolute; top: -6px; right: -12px; bottom: 6px; width: 12px; background: color-mix(in srgb, var(--slab-c, #21B6F7) 35%, #000); transform: skewY(-63deg); transform-origin: top left; border-radius: 0 2px 2px 0; }
.slab__fill { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--f, 0) * 100%); background: linear-gradient(0deg, color-mix(in srgb, var(--slab-c, #21B6F7) 92%, #000), color-mix(in srgb, var(--slab-c, #21B6F7) 60%, transparent)); border-radius: 0 0 2px 2px; }
.slab__cube > span, .slab__cube > b { position: relative; z-index: 1; }
.slab__top { font: 500 9.5px/1 var(--f-mono); letter-spacing: .1em; color: rgba(255, 255, 255, .78); }
.slab__cube b { font: 500 16px/1 var(--f-mono); font-stretch: 87.5%; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.slab__clk { font: 500 13px/1 var(--f-mono); color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.slab__n { font: 400 9px/1 var(--f-mono); letter-spacing: .06em; color: rgba(255, 255, 255, .72); }
.slab__lbl { font: 700 11px/1.25 var(--f-display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .02em; color: var(--fg-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; transition: color var(--d2) var(--ease); }
.slab a:hover .slab__lbl { color: var(--fg); }
.slab.is-hot .slab__cube { box-shadow: 0 0 0 1px var(--t-red), 0 0 26px rgba(230, 55, 24, .45); }
.slab.is-upcoming .slab__cube { background: transparent; outline: 1px dashed var(--line-3); outline-offset: -1px; }
.slab.is-upcoming .slab__top, .slab.is-upcoming b, .slab.is-upcoming .slab__clk, .slab.is-upcoming .slab__n { color: var(--fg-2); text-shadow: none; }
.slab.is-closed .slab__cube { filter: saturate(.2) brightness(.8); }
.slabs__legend { display: flex; align-items: center; gap: 12px; margin: 4px 0 6px; font: 400 9px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }

/* ---------- lot page: dark mat gallery with a thermal view ---------- */
.gal { display: grid; gap: 10px; min-width: 0; }
.gal__stage { position: relative; width: 100%; aspect-ratio: 5 / 5.2; max-height: 74vh; border-radius: var(--r-2); background: radial-gradient(ellipse at 50% 40%, var(--bg-3), var(--sheet) 70%); border: 1px solid var(--line); overflow: hidden; }

.gal__bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.gal__thumbs { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; }
.gal__thumbs button { width: 52px; height: 52px; padding: 3px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--bg-3); transition: border-color var(--d2) var(--ease); }
.gal__thumbs button img { width: 100%; height: 100%; object-fit: contain; }
.gal__thumbs button[aria-pressed="true"] { border-color: var(--fg); }
.gal__count { font: 400 9.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); margin-right: auto; }
.gal__nav { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r); border: 1px solid var(--line-2); transition: border-color var(--d2) var(--ease); }
.gal__nav:hover { border-color: var(--fg-2); }
.gal__nav .ic { width: 16px; height: 16px; }
.gal__therm[aria-pressed="true"] { color: var(--accent-ink); }
.gal__seal { position: absolute; inset: 0; z-index: 2; pointer-events: none; display: grid; place-items: center; }
.gal__seal canvas { width: 100%; height: 46%; }
.shock { position: absolute; left: 50%; top: 50%; width: 140%; aspect-ratio: 1; margin-left: -70%; margin-top: -70%; border-radius: 50%; background: conic-gradient(from 0deg, #21B6F7, #8EDEFE, #E79332, #E63718, #FB55AA, #FEA8F6, #21B6F7); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); pointer-events: none; opacity: 0; }
.zoom .ov__panel { width: min(1100px, 100%); }
.zoom__stage { position: relative; height: min(72vh, 820px); overflow: hidden; border-radius: var(--r); background: var(--bg-3); cursor: zoom-in; touch-action: none; }
.zoom__stage.is-in { cursor: grab; }
.zoom__stage img { width: 100%; height: 100%; object-fit: contain; transform-origin: 0 0; transition: transform var(--d3) var(--ease); }
.zoom__hint { margin: 10px 0 0; font-size: var(--t-xs); color: var(--fg-3); }

.lh { display: grid; gap: 8px; }
.lh .eyebrow { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.lh .eyebrow a { color: inherit; }
.lot__maker { display: grid; gap: 8px; }
.lh__meta { margin: 4px 0 0; font: 400 11px/1.5 var(--f-mono); color: var(--fg-3); }
.lh__state { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.clk { display: grid; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--sheet); }
.clk__row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.clk__v { font: 500 clamp(38px, 4.2vw, 54px)/1 var(--f-mono); font-stretch: 87.5%; font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
.lot.is-hot .clk__v { color: var(--hot-ink); text-shadow: 0 0 22px rgba(230, 55, 24, .5); }
.lot.is-closed .clk__v, .lot.is-pending .clk__v { color: var(--fg-3); }
.hzm { position: relative; height: 10px; border-radius: 5px; background: var(--bg-3); overflow: hidden; }
.hzm__bar { position: absolute; top: 0; bottom: 0; left: 50%; width: 100%; transform: translateX(-50%) scaleX(var(--w, 1)); transform-origin: 50% 50%; border-radius: 5px; background: linear-gradient(90deg, var(--t-red), var(--t-pink) 50%, var(--t-red)); }
.hzm__pre { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left; transform: scaleX(var(--p, 0)); background: linear-gradient(90deg, #0D6CC1, #21B6F7 60%, #E79332); border-radius: 5px; }
.hzm.is-reset .hzm__bar { animation: hzmReset 900ms var(--ease); }
@keyframes hzmReset { 0% { filter: brightness(2.2); } 100% { filter: none; } }
.clk__at { margin: 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font: 400 10px/1.4 var(--f-mono); color: var(--fg-3); letter-spacing: .02em; }
.clk__at b { color: var(--fg-2); font-weight: 500; }
.clk__hot { margin: 0; display: none; font-size: var(--t-xs); color: var(--fg-2); line-height: 1.45; }
.clk__hot b { color: var(--hot-ink); }
.lot.is-hot .clk__hot { display: block; }
.clk.is-reset { animation: clkFlash 1100ms var(--ease); }
@keyframes clkFlash { 0% { box-shadow: 0 0 0 1px var(--t-red), 0 0 40px rgba(230, 55, 24, .5); } 100% { box-shadow: 0 0 0 1px transparent, 0 0 0 transparent; } }
.price { border-top: 0; padding-top: 4px; }
.price__v--engraved { background: var(--heat-text); -webkit-background-clip: text; background-clip: text; color: transparent !important; -webkit-text-fill-color: transparent; }
.lot .price .pill { border-color: var(--line-2); }

/* ---------- the heat-column instrument ---------- */
.hc { position: relative; }
.hc__cv { display: block; width: 100%; height: clamp(200px, 27vw, 280px); touch-action: pan-y; }
.hc__tip { position: absolute; z-index: 3; min-width: 180px; max-width: 260px; padding: 9px 11px; border-radius: var(--r); background: var(--tip-bg); color: var(--tip-fg); font: 400 11px/1.5 var(--f-mono); pointer-events: none; box-shadow: var(--shadow-2); transform: translate(-50%, calc(-100% - 12px)); font-variant-numeric: tabular-nums; }
.hc__tip b { color: var(--tip-hl); font-weight: 600; }
.hc__legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; padding: 0; list-style: none; font: 400 9.5px/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.hc__legend li { display: flex; align-items: center; gap: 6px; }
.hc__legend i { display: inline-block; width: 18px; height: 9px; border-radius: 2px; }
.hc__legend .k-ramp { width: 46px; background: linear-gradient(90deg, #0D6CC1, #21B6F7, #E79332, #E63718, #FB55AA, #FEE7FE); }
.hc__legend .k-you { background: transparent; box-shadow: inset 0 0 0 2px var(--you); }
.hc__legend .k-next { background: transparent; box-shadow: inset 0 0 0 1px var(--fg-3); }
.hc__legend .k-max { height: 0; border-top: 2px dashed var(--you); border-radius: 0; }
.hc__legend .k-reset { width: 9px; height: 9px; border-radius: 50%; background: var(--t-pink); box-shadow: 0 0 6px var(--t-pink); }
.hc__q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.hc__qcv { display: block; width: 100%; height: 30px; }
.hc__ql { font: 400 10px/1.2 var(--f-mono); color: var(--fg-3); white-space: nowrap; }
.hc__ql b { color: var(--fg); font-weight: 500; }
.inst { background: var(--sheet); border-color: var(--line); border-radius: var(--r-2); }

/* ---------- home: the heat map and media ---------- */
.hm2 { position: relative; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--sheet); overflow: hidden; }
.hm2__cv { display: block; width: 100%; height: clamp(260px, 34vw, 420px); }
.hm2__keys { list-style: none; margin: 0; padding: 0; position: absolute; inset: 0; pointer-events: none; }
.hm2__keys li { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); pointer-events: auto; }
.hm2__keys a { display: grid; justify-items: center; gap: 3px; padding: 5px 8px; border-radius: var(--r); text-decoration: none; text-align: center; background: rgba(7, 8, 10, .55); backdrop-filter: blur(3px); color: #F2F3F5; transition: background-color var(--d2) var(--ease); }
.hm2__keys a:hover { background: rgba(7, 8, 10, .85); }
.hm2__keys b { font: 500 9.5px/1 var(--f-mono); letter-spacing: .1em; }
.hm2__keys span { font: 800 11px/1.15 var(--f-display); font-stretch: 112%; text-transform: uppercase; max-width: 15ch; }
.hm2__keys em { font: 500 11px/1 var(--f-mono); font-style: normal; color: #FEA8F6; }
.hm2__keys li.is-hot a { box-shadow: 0 0 0 1px var(--t-red), 0 0 18px rgba(230, 55, 24, .6); }
.hm2__note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding: 10px 14px; border-top: 1px solid var(--line); font: 400 9.5px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
@media (max-width: 640px) { .hm2__keys span { display: none; } }
.hmx { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.hmx a { display: grid; gap: 10px; text-decoration: none; }
.hmx figure { margin: 0; aspect-ratio: 4 / 3; border-radius: var(--r-2); overflow: hidden; background: var(--bg-3); }
.hmx img { width: 100%; height: 100%; object-fit: cover; transition: filter var(--d3) var(--ease); }
.hmx a:hover img, .story a:hover img, .feat:hover .feat__fig img { filter: url(#thermal); }
.hmx .eyebrow { margin: 0; }
.hmx h3 { margin: 0; font: 800 var(--t-md)/1.2 var(--f-display); font-stretch: 112%; text-transform: uppercase; transition: color var(--d2) var(--ease); }
.hmx a:hover h3 { color: var(--accent-ink); }
.hmx li:first-child { grid-column: span 2; }
.hmx li:first-child figure { aspect-ratio: 16 / 9; }
.hmx li:first-child h3 { font-size: clamp(22px, 2.4vw, 32px); font-weight: 900; font-stretch: 125%; line-height: 1; }
@media (max-width: 640px) { .hmx li:first-child { grid-column: auto; } }
.hmx ol, ol.hmx { list-style: none; margin: 0; padding: 0; }

/* ---------- market: isobands and the heat table ---------- */
.iso { margin: 0; }
.iso__cap { margin: 0 0 16px; }
.iso__cap .sh__t { margin: 0 0 6px; }
.iso__wrap { position: relative; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--sheet); overflow: hidden; }
.iso__cv { display: block; width: 100%; height: clamp(300px, 38vw, 460px); }
.iso__tip { position: absolute; z-index: 2; max-width: 260px; padding: 9px 11px; border-radius: var(--r); background: var(--tip-bg); color: var(--tip-fg); font: 12px/1.45 var(--f-ui); pointer-events: none; box-shadow: var(--shadow-2); transform: translate(-50%, calc(-100% - 14px)); }
.iso__tip b { display: block; font-weight: 700; margin-bottom: 2px; }
.iso__tip span { font-family: var(--f-mono); color: var(--tip-hl); }
.iso .legend { margin-top: 12px; }
.iso .sw--art { background: #FFFFFF; border-radius: 50%; box-shadow: 0 0 0 1px #07080A; }
.iso .sw--card { background: transparent; border: 2px solid #07080A; border-radius: 50%; outline: 1px solid #fff; }
.iso .sw--ramp { width: 60px; background: linear-gradient(90deg, #021358, #0D6CC1, #21B6F7, #E5CDA8, #E79332, #E63718, #FB55AA, #FEE7FE); }
.htab { margin-top: 26px; }
.htab table { border-collapse: separate; border-spacing: 3px; width: 100%; font: 400 11px/1 var(--f-mono); }
.htab th { padding: 6px 8px; text-align: left; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); white-space: nowrap; font-size: 9.5px; }
.htab td { height: 38px; min-width: 52px; border-radius: 3px; text-align: center; color: #07080A; font-weight: 600; background: var(--bg-3); }
.htab td.is-0 { color: var(--fg-4); font-weight: 400; }
.htab td.is-dark { color: #F2F3F5; }
.htab caption { caption-side: bottom; text-align: left; padding-top: 8px; font: 400 10px/1.4 var(--f-mono); color: var(--fg-3); }

/* ---------- observed elsewhere ---------- */
.obs__strip { position: relative; height: 70px; margin: 18px 0 8px; border-radius: var(--r-2); background: linear-gradient(90deg, rgba(13, 108, 193, .18), rgba(231, 147, 50, .16), rgba(251, 85, 170, .18)); }
.obs__dot { position: absolute; bottom: 14px; left: var(--x); width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 2px var(--sheet); }
.obs__dot--live { width: 16px; height: 16px; margin-left: -8px; bottom: 12px; background: var(--t-pink); box-shadow: 0 0 14px var(--t-pink), 0 0 0 2px var(--sheet); }
.obs__lbl { position: absolute; bottom: 36px; left: var(--x); transform: translateX(-50%); font: 400 10px/1.2 var(--f-mono); color: var(--fg-2); white-space: nowrap; }
.obs__lbl--live { color: var(--accent-ink); font-weight: 600; bottom: 38px; }
.obs__axis { display: flex; justify-content: space-between; font: 400 9.5px/1 var(--f-mono); color: var(--fg-3); }

/* ---------- hot zone demo ---------- */
.hzd { display: grid; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--sheet); }
.hzd__top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.hzd__top .eyebrow { margin: 0; color: var(--fg); }
.hzd__t { font: 500 clamp(32px, 4vw, 46px)/1 var(--f-mono); font-stretch: 87.5%; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.hzd.is-hot .hzd__t { color: var(--hot-ink); text-shadow: 0 0 18px rgba(230, 55, 24, .5); }
.hzd__msg { margin: 0; font-size: var(--t-sm); color: var(--fg-2); min-height: 3em; }
.hzd__acts { display: flex; flex-wrap: wrap; gap: 8px; }
.hzd__log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font: 400 11px/1.4 var(--f-mono); color: var(--fg-3); max-height: 120px; overflow: auto; }
.hzd__log li.is-reset { color: var(--hot-ink); }

/* ---------- page change: an iris from the point you clicked, with a heat rim ---------- */
.iris-rim { position: fixed; z-index: 45; left: 0; top: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; pointer-events: none; background: conic-gradient(from 0deg, #21B6F7, #8EDEFE, #E79332, #E63718, #FB55AA, #FEA8F6, #21B6F7); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); }

/* ---------- splash: the thermal boot ---------- */
.spl { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 20px; background: #050608; color: #F2F3F5; transition: opacity var(--d3) var(--ease); overflow: hidden; }
.spl.is-out { opacity: 0; }
.spl::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px); }
.spl__box { position: relative; width: min(820px, 100%); display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: center; }
@media (min-width: 760px) { .spl__box { grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); } }
.spl__log { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font: 400 11px/1.45 'Martian Mono', ui-monospace, monospace; color: #8A8F97; min-height: 170px; }
.spl__log li { opacity: 0; transform: translateY(4px); transition: opacity 200ms linear, transform 200ms var(--ease); }
.spl__log li.is-in { opacity: 1; transform: none; }
.spl__log b { color: #F2F3F5; font-weight: 500; }
.spl__log .ok { color: #27AD75; } .spl__log .wip { color: #E79332; }
.spl__wall { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; aspect-ratio: 1; }
.spl__wall i { position: relative; border-radius: 2px; background: #0E1013; background-size: cover; background-position: center; transition: transform 380ms var(--ease), opacity 380ms var(--ease), box-shadow 300ms linear; }
.spl__wall i.is-on { box-shadow: 0 0 0 1px rgba(255, 255, 255, .06); }
.spl__wall i::after { content: ''; position: absolute; inset: 0; border-radius: 2px; background: var(--c, #021358); opacity: 0; transition: opacity 600ms linear; }
.spl__wall i.is-hot::after { opacity: .85; }
.spl__wall.is-collapse i { transform: scale(0); opacity: 0; }
.spl__mark { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.spl__mark canvas { width: 100%; height: 40%; }
.spl__foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; font: 400 10px/1.2 'Martian Mono', ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: #8A8F97; }
.spl__meter { position: relative; flex: 1; height: 4px; border-radius: 2px; background: #171A1F; overflow: hidden; }
.spl__meter i { position: absolute; inset: 0; background: var(--heat-grad); transform-origin: left; transform: scaleX(0); }
.spl__skip { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid rgba(255, 255, 255, .18); border-radius: 3px; color: #F2F3F5; font: 500 10px/1 'Martian Mono', ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
.spl__skip kbd { border-color: rgba(255, 255, 255, .2); color: #8A8F97; }
.spl__skip:hover { border-color: #F2F3F5; }
.spl__wallwrap { position: relative; }

/* ---------- small overrides for the Thermal voice ---------- */
.ph { border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.ph__lede { color: var(--fg-2); }
.sh { border-top: 1px solid var(--line-2); }
.sh__t em, .ph__t em { font-style: normal; }
.btn--ink { box-shadow: 0 0 0 1px rgba(255, 255, 255, .1); }
.btn--line { border-color: var(--line-3); }
.chip { font-family: var(--f-mono); font-size: 11px; letter-spacing: .02em; }
.chip.is-on, .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg { border-radius: 999px; padding: 3px; }
.seg button { border-radius: 999px; font-size: 10.5px; }
.seg--big { border-radius: var(--r-2); } .seg--big button { border-radius: var(--r); }
.tag { font-size: 9.5px; letter-spacing: .08em; }
.tag--hot { border-color: var(--t-red); color: var(--hot-ink); background: rgba(230, 55, 24, .14); }
.pill { font-size: 9.5px; letter-spacing: .1em; }
.pill--live { color: var(--live-ink); border-color: var(--live); box-shadow: 0 0 12px -2px rgba(251, 85, 170, .5); }
.pill--live::before { box-shadow: 0 0 8px var(--live); }
.tile { border: 1px solid var(--line); border-radius: var(--r-2); background: var(--sheet); overflow: hidden; gap: 0; }
.tile__fig { border-radius: 0; background: var(--bg-3); }
.tile__body { padding: 12px 14px 4px; }
.tile .watch { margin: 0 4px 6px; }
.tile__t { text-transform: uppercase; font-size: var(--t-sm); letter-spacing: .01em; }
.tiles--list .tile { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; }
.tiles--list .tile__body { padding: 0; }
.grade { background: var(--heat-grad); color: #07080A; border-radius: 3px; }
.badge { border-radius: 3px; }
.stand { border-radius: 0 var(--r) var(--r) 0; background: var(--bg-2); }
.stand--lead { border-color: var(--ok); } .stand--out { border-color: var(--t-amber); } .stand--won { border-color: var(--t-pink); box-shadow: var(--glow); }
.tile__fig, .collected__i figure, .salon__i figure, .lbp__fig, .sale figure, .arow img, .review__lot > img, .inv__lot > img { border-radius: var(--r); }
.collected__i figure, .salon__i figure, .lbp__fig { background: var(--bg-3); }
.feat { border-radius: var(--r-2); overflow: hidden; border-color: var(--line); }
.story figure { border-radius: var(--r-2); }
.wiz, .pay, .pricebox, .sellcard, .empty, .galley { border-radius: var(--r-2); border-color: var(--line); }
.pricebox { background: var(--sheet); }
.stats, .strip3, .strip4, .steps4 > ol, ol.steps4 { border-color: var(--line); }
.stats > div, .strip3 > div, .strip4 > div, .steps4 li { border-color: var(--line); }
.stats dd { font-family: var(--f-mono); font-weight: 500; }
.ledger__row.is-you .ledger__amt, .ledger__row.is-you .ledger__who { color: var(--you); }
.qr { background: #FFFFFF; border-radius: var(--r); }
.receipt canvas { border-radius: var(--r); }
.marks__i img { border-radius: var(--r); }
.marks__i button:hover img { filter: url(#thermal); }
.art__body > p:first-of-type::first-line { font-weight: 600; }
.toc li::marker { font-family: var(--f-mono); color: var(--fg-3); }
.lc__spark, .price__spark { color: var(--fg); }
.spark rect { fill: var(--fg-4); } .spark rect.is-top { fill: var(--t-pink); } .spark rect.is-you { fill: var(--you); }
.readbar { background: var(--heat-grad); height: 3px; }
.guide__rail a[aria-current] { border-left-color: var(--t-pink); }
.acct__nav a[aria-current] { border-left-color: var(--t-pink); }
.wiz__rail li.is-on { border-color: var(--t-pink); }
.lb__row.is-sel .lb__btn { box-shadow: inset 2px 0 0 var(--t-pink); }
.lbp__t { text-transform: uppercase; font-stretch: 112%; }
.lbp__t em { text-transform: none; font-weight: 300; font-style: italic; color: var(--fg-2); }

.lot.is-closed .lh__state .tag, .lot.is-pending .lh__state .tag { display: none; }
.lot.is-closed .lh__state .pill--live { color: var(--fg-2); border-color: var(--line-2); box-shadow: none; }
.lot.is-closed .lh__state .pill--live::before { background: var(--fg-3); box-shadow: none; }

</style>
</head>

        root.querySelectorAll('[data-live-clock]').forEach(el => {
          const a = C.session.get(el.dataset.liveClock); if (!a) return;

          if (a.state === 'live') txt = F.clock(a.endsAt - now);
          else if (a.state === 'upcoming') txt = F.clock(a.opensAt - now);
          else if (a.state === 'pending') txt = '00:00';
          else txt = a.state === 'sold' ? 'Sold' : 'Unsold';
          if (el.textContent !== txt) el.textContent = txt;
          const hot = a.hot(now), host = el.closest('[data-live-host]') || el;
          host.classList.toggle('is-hot', hot); host.classList.toggle('is-live', a.state === 'live'); host.classList.toggle('is-closed', a.state === 'sold' || a.state === 'unsold'); host.classList.toggle('is-pending', a.state === 'pending'); host.classList.toggle('is-upcoming', a.state === 'upcoming');
          if (hot) host.style.setProperty('--hot', C.clamp((a.endsAt - now) / C.HOT, 0, 1).toFixed(3));
        });
        root.querySelectorAll('[data-live-pill]').forEach(el => {
          const a = C.session.get(el.dataset.livePill); if (!a) return;
          const left = a.state === 'upcoming' ? a.opensAt - now : a.endsAt - now;
          const txt = a.state === 'live' ? 'Live · ' + F.left(left) : a.state === 'upcoming' ? 'Opens in ' + F.left(left) : a.state === 'pending' ? 'Closing…' : (a.state === 'sold' ? 'Sold' : 'Unsold');
          if (el.textContent !== txt) el.textContent = txt;
        });
      });
      const hc = document.querySelectorAll('[data-live-house]'); if (hc.length) { const t = F.time(now, true); hc.forEach(el => { if (el.textContent !== t) el.textContent = t; }); }
    },
    refresh(a) {
      this.roots.forEach(root => {
        root.querySelectorAll('[data-live-price="' + a.id + '"]').forEach(el => this.rollText(el, a.hasBids ? F.usd(a.current) : F.usd(a.opening)));

    const sets = Array.from(new Set(all.map(r => r.set))).sort();

    return {
      title: sold ? 'Cards · Sold' : 'Cards available from the record',
      html: h`
        ${V.slug('Fixed-price cards')}
        <header class="ph" data-d="LAW-145 D5742 LAW-102">
          ${V.eyebrow('Fixed-price cards')}
          <h1 class="ph__t">${raw(S().pageTitle ? S().pageTitle('Cards available from the record.') : 'Cards available from the record.')}</h1>

        <nav class="tabs" aria-label="Catalogue shelves"><a href="#cards" data-go="cards" aria-current="${!sold ? 'page' : 'false'}">For sale <span class="tabs__n">${D.cards.length}</span></a><a href="#cards-sold" data-go="cards-sold" aria-current="${sold ? 'page' : 'false'}">Sold <span class="tabs__n">${D.cardsSold.length}</span></a></nav>

            ${issuers.length ? h`<fieldset class="fs"><legend>Issuer</legend>${issuers.map(i => h`<label class="check"><input type="checkbox" data-issuer="${i}" ${st.issuers.has(i) ? raw('checked') : ''}><span>${i === 'BTCTC' ? 'Based Trading Cards' : i} <span class="muted">(${cnt(r => r.issuer === i)})</span></span></label>`)}</fieldset>` : ''}

            <fieldset class="fs"><legend>Price (USD)</legend>
              <div class="range" data-range><input type="range" id="rmin" min="7500" max="300000" step="500" value="${st.min}" aria-label="Minimum price"><input type="range" id="rmax" min="7500" max="300000" step="500" value="${st.max}" aria-label="Maximum price"><i class="range__fill"></i></div>
              <p class="range__out mono"><span data-rmin>${F.usd(st.min, { whole: true })}</span> – <span data-rmax>${F.usd(st.max, { whole: true })}</span></p>
              <div class="chips">${[['Under $250', 0, 25000], ['$250–500', 25000, 50000], ['$500–1k', 50000, 100000], ['$1k+', 100000, 300000]].map(([l, a, b]) => h`<button type="button" class="chip" data-quick="${a}-${b}">${l}</button>`)}</div>
            </fieldset>
            <div class="field"><label for="cat-sort">Sort</label><select id="cat-sort"><option value="newest">Newest</option><option value="asc">Price · low to high</option><option value="desc">Price · high to low</option><option value="grade">Grade · high to low</option></select></div>
            <button type="button" class="btn btn--ghost" data-reset>Clear filters</button>
          </aside>
          <section class="cat__res" aria-label="Results">
            <div class="cat__bar"><p class="count" aria-live="polite" data-count></p><div class="seg" role="group" aria-label="View"><button type="button" data-view="grid" aria-pressed="${st.view === 'grid'}">${raw(C.icon('grid'))}<span class="sr-only">Grid</span></button><button type="button" data-view="list" aria-pressed="${st.view === 'list'}">${raw(C.icon('list'))}<span class="sr-only">List</span></button></div></div>
            <div class="tiles tiles--${st.view}" data-tiles></div>
            <p class="empty" data-empty hidden>No object matches these filters. <button type="button" class="lnk" data-reset>Clear filters</button></p>
          </section>
        </div>
        <section class="sec strip3" data-d="D3232">
          <div><p class="eyebrow">Object-first</p><p>Grade, series, reference and population stay attached to the permanent lot record.</p></div>
          <div><p class="eyebrow">Dealer record</p><p>Named organizations are catalogue provenance—not public collector identities.</p></div>
          <div><p class="eyebrow">Bitcoin settlement</p><p>Prices are shown in USD; confirmed purchases settle through CLCT’s Bitcoin-native invoice flow.</p></div>
        </section>`,
      mount(root) {
        const tiles = C.$('[data-tiles]', root), count = C.$('[data-count]', root), empty = C.$('[data-empty]', root);
        const sortSel = C.$('#cat-sort', root); sortSel.value = st.sort;
        const apply = (animate) => {
          let list = all.filter(r => {
            if (st.q && !(r.title + ' ' + r.ref + ' ' + r.set).toLowerCase().includes(st.q.toLowerCase())) return false;
            if (st.grades.size && !Array.from(st.grades).some(g => g === 'Ungraded' ? !r.grade : r.grade === g)) return false;
            if (st.issuers.size && !st.issuers.has(r.issuer)) return false;
            if (st.sets.size && !st.sets.has(r.set)) return false;
            return r.price >= st.min && r.price <= st.max;
          });
          if (st.sort === 'asc') list.sort((a, b) => a.price - b.price); else if (st.sort === 'desc') list.sort((a, b) => b.price - a.price); else if (st.sort === 'grade') list.sort((a, b) => (b.gradeNum || 0) - (a.gradeNum || 0)); else list.sort((a, b) => (b.listed || '').localeCompare(a.listed || ''));
          const first = new Map(Array.from(tiles.children).map(el => [el.dataset.card, el.getBoundingClientRect()]));
          tiles.className = 'tiles tiles--' + st.view;
          tiles.innerHTML = list.map(r => String(V.cardTile(r))).join('');
          count.textContent = (list.length === all.length ? '' : list.length + ' of ') + all.length + (sold ? ' sold objects' : ' objects');
          empty.hidden = list.length > 0;
          if (animate && !C.motion.reduced) Array.from(tiles.children).forEach(el => { const f = first.get(el.dataset.card); const l = el.getBoundingClientRect(); if (f) { const dx = f.left - l.left, dy = f.top - l.top; if (dx || dy) el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.32,.72,0,1)' }); } else el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240 }); });
          document.title = 'Cards' + (st.grades.size ? ': ' + Array.from(st.grades).join(', ') : '') + ' · CLCT — ' + S().name;
        };
        root.addEventListener('change', (e) => {

          if (t.dataset.grade) { t.checked ? st.grades.add(t.dataset.grade) : st.grades.delete(t.dataset.grade); apply(true); }
          if (t.dataset.issuer) { t.checked ? st.issuers.add(t.dataset.issuer) : st.issuers.delete(t.dataset.issuer); apply(true); }
          if (t.dataset.set) { t.checked ? st.sets.add(t.dataset.set) : st.sets.delete(t.dataset.set); apply(true); }
          if (t.id === 'cat-sort') { st.sort = t.value; apply(true); }
        });
        let qT; C.$('#cat-q', root).addEventListener('input', (e) => { clearTimeout(qT); qT = setTimeout(() => { st.q = e.target.value; apply(true); }, 250); });
        const rmin = C.$('#rmin', root), rmax = C.$('#rmax', root), fill = C.$('.range__fill', root);
        const drawRange = () => { const lo = Math.min(+rmin.value, +rmax.value), hi = Math.max(+rmin.value, +rmax.value); st.min = lo; st.max = hi; C.$('[data-rmin]', root).textContent = F.usd(lo, { whole: true }); C.$('[data-rmax]', root).textContent = F.usd(hi, { whole: true }); const span = 300000 - 7500; fill.style.left = ((lo - 7500) / span * 100) + '%'; fill.style.right = (100 - (hi - 7500) / span * 100) + '%'; };
        let rT; [rmin, rmax].forEach(r => r.addEventListener('input', () => { drawRange(); clearTimeout(rT); rT = setTimeout(() => apply(true), 160); }));
        drawRange();
        root.addEventListener('click', (e) => {
          const v = e.target.closest('[data-view]'); if (v) { st.view = v.dataset.view; C.ls.set('catView', st.view); C.$$('[data-view]', root).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.view === st.view))); if (document.startViewTransition && !C.motion.reduced) document.startViewTransition(() => apply(false)); else apply(false); }
          const q = e.target.closest('[data-quick]'); if (q) { const [a, b] = q.dataset.quick.split('-').map(Number); rmin.value = Math.max(7500, a); rmax.value = b; drawRange(); apply(true); }
          if (e.target.closest('[data-reset]')) { st.q = ''; st.grades.clear(); st.issuers.clear(); st.sets.clear(); st.min = 7500; st.max = 300000; C.router.resolve(true); }

  V['cards-sold'] = () => V.cards({}, true);

  /* ===================================================================== CARD (fixed price) */
  V.card = (p) => {
    const r = C.lot(p.id); if (!r || r.kind !== 'card') return V.notfound(p);
    if (!r.fx) return V.lot(p);
    const sold = r.status === 'sold';
    const prem = C.premium(r.price);
    const myOffer = () => C.user.offers.find(o => o.rec.id === r.id && o.status !== 'withdrawn');
    return {
      title: r.title,
      html: h`
        ${V.slug('Card · REF ' + r.ref)}
        <nav class="crumbs" aria-label="Breadcrumb"><a href="#cards" data-go="cards">Cards</a><span aria-hidden="true">/</span><span>${r.set}</span><span aria-hidden="true">/</span><span aria-current="page">${r.title}</span></nav>
        <article class="lot lot--card">
          <div class="lot__media">${raw(S().gallery(r, null))}</div>
          <aside class="lot__panel" data-d="D3762 D3815 D0968 GR01">
            <p class="eyebrow">REF ${r.ref} · ${sold ? 'Sold · permanent record' : 'For sale'}</p>
            <h1 class="lot__title">${r.title}</h1>
            <dl class="facts facts--grid">
              ${r.grade ? h`<div><dt>Grade</dt><dd>${r.grade}</dd></div>` : h`<div><dt>Issuer</dt><dd>Cardsmiths</dd></div>`}
              <div><dt>Series / set</dt><dd>${r.set}</dd></div>
              ${r.number ? h`<div><dt>Card / object no.</dt><dd>${r.number}</dd></div>` : ''}
              ${r.year ? h`<div><dt>Year</dt><dd>${r.year}</dd></div>` : ''}
              ${r.pop ? h`<div><dt>Population</dt><dd>${r.pop}</dd></div>` : ''}
              ${r.cert ? h`<div><dt>Certificate</dt><dd class="mono">${r.cert}</dd></div>` : ''}
            </dl>
            ${r.grader ? h`<p class="note">${raw(C.icon('check'))} Slabbed and graded by ${r.grader}. Certification details are recorded by CLCT.</p>` : r.note ? h`<p class="note">${r.note}</p>` : ''}
            <div class="pricebox" data-d="D5617 D5828 PAIR-149">
              <div class="price__row"><span class="lbl">${sold ? 'Sold for' : 'Fixed price'}</span><span class="price__v${sold ? ' price__v--engraved' : ''}">${F.usd(r.price)}</span></div>
              ${sold ? h`<p class="note">${r.record}. The transaction state is retained here with the object record; this page is not removed after the sale.</p>` : h`
              <p class="eyebrow">First completed purchase acquires the lot</p>
              <dl class="ledgerx"><div><dt>Object</dt><dd>${F.usd(r.price)}</dd></div><div><dt>Buyer’s premium (5%)</dt><dd>${F.usd(prem)}</dd></div><div class="ledgerx__total"><dt>Total before tax / fulfillment</dt><dd>${F.usd(r.price + prem)} <span class="muted" data-btc-of="${r.price + prem}">${F.btcEst(r.price + prem)}</span></dd></div></dl>
              <p class="note small">The dollar total is confirmed before purchase and settled in bitcoin. No BTC amount is fixed until a payment request is generated.</p>
              <button type="button" class="btn btn--ink btn--block" data-acquire>Acquire this lot</button>
              <button type="button" class="btn btn--line btn--block" data-offer data-tour="offer-open">Make an offer</button>
              <p class="note small">Private and time-bound. An offer does not reserve the lot.</p>`}
              <div class="offerstate" data-offerstate aria-live="polite"></div>
            </div>
            <div class="lot__acts">${V.watchBtn(r.id)}<button type="button" class="btn btn--ghost" data-share="https://clctibles.com/catalogue/cards/${r.id}">${raw(C.icon('share'))}<span>Share</span></button><button type="button" class="btn btn--ghost" data-copy="https://clctibles.com/catalogue/cards/${r.id}">${raw(C.icon('link'))}<span>Copy permanent link</span></button></div>
            <p class="cond"><a href="#how" data-go="how">Conditions of Sale</a> — Authenticity and material-description claims follow §3.</p>
          </aside>
        </article>
        ${!sold ? h`<section class="sec steps4" aria-labelledby="aa-t" data-d="D0246 LAW-20"><h2 class="sh__t" id="aa-t">From commitment to the record</h2><ol>
          <li><b>Confirm</b><span>Review the object price, premium and binding Conditions of Sale.</span></li>
          <li><b>Invoice</b><span>The obligation is recorded in U.S. dollars and is due within 48 hours.</span></li>
          <li><b>Settle in bitcoin</b><span>Generate a current on-chain or Lightning payment request for the dollar balance.</span></li>
          <li><b>Fulfill and retain</b><span>Collection or shipping follows settlement; the object and sale record remain accessible.</span></li></ol></section>` : ''}
        <section class="sec"><h2 class="sh__t">Grading population</h2><p class="prose muted">What each grading company reports having graded of this card, as that company reported it. Each report stands on its own and counts are never added across graders. It describes the graders’ records, not this copy.</p><p class="prose">${r.pop ? 'The grader reports a population of ' + r.pop + ' at this grade for this variant.' : 'No linked population report is currently available for this card.'}</p></section>`,
      mount(root) {
        const os = C.$('[data-offerstate]', root);
        const drawOffer = () => {
          const o = myOffer(); if (!o) { os.innerHTML = ''; return; }
          const t = { pending: '<b>Your offer of ' + F.usd(o.amount) + '</b><span>Private and binding until ' + F.dayTime(o.expiresAt) + '. The house will respond, or the offer will expire. This does not hold the lot — Acquire at the ask remains open to others.</span>' + (o.note ? '<span class="muted">Your note: ' + C.esc(o.note) + '</span>' : '') + '<button type="button" class="btn btn--ghost" data-withdraw>Withdraw offer</button>',

  V.acquire = (r, origin, qty = 1) => {

  V.offerSheet = (r, origin) => {

        <div class="field field--money"><label for="of-amt">Your offer (USD)</label><div class="money"><span aria-hidden="true">$</span><input id="of-amt" inputmode="decimal" autocomplete="off" data-tour="offer-amount" aria-describedby="of-hint" autofocus></div><p class="hint" id="of-hint">Enter dollars and cents, below the asking price. Extreme lowballs are refused.</p></div>

  /* ===================================================================== MARKET */
  const svgW = 720;
  V.chart = {
    // stacked vertical bars (records by year, by category)
    stacked(rows, cats, o = {}) {
      const W = o.w || svgW, H = o.h || 260, pl = 54, pr = 12, pt = 14, pb = 34;
      const mx = Math.max(...rows.map(r => r.c.reduce((a, b) => a + b, 0)));
      const nice = Math.ceil(mx / 500) * 500, bw = (W - pl - pr) / rows.length;
      const y = v => pt + (H - pt - pb) * (1 - v / nice);
      let s = '';
      for (let g = 0; g <= 4; g++) { const v = nice * g / 4, yy = y(v); s += '<line class="ch__grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '"/><text class="ch__tick" x="' + (pl - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + F.int(v) + '</text>'; }
      rows.forEach((r, i) => {
        let acc = 0; const x = pl + i * bw + bw * 0.18, w = bw * 0.64;
        r.c.forEach((v, k) => { if (!v) return; const y0 = y(acc), y1 = y(acc + v); s += '<rect class="ch__bar cat' + (k + 1) + '" x="' + x.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(0.5, y0 - y1).toFixed(1) + '"><title>' + r.y + ' · ' + cats[k] + ': ' + F.int(v) + '</title></rect>'; acc += v; });
        s += '<text class="ch__lbl" x="' + (x + w / 2) + '" y="' + (H - 12) + '" text-anchor="middle">' + r.y + (r.partial ? '*' : '') + '</text><text class="ch__val" x="' + (x + w / 2) + '" y="' + (y(acc) - 6) + '" text-anchor="middle">' + F.int(acc) + '</text>';
      });
      return '<div class="chwrap"><svg class="ch" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + C.esc(o.label || '') + '">' + s + '</svg></div>';
    },
    mix(rows, cats, o = {}) {
      const W = o.w || svgW, rowH = 22, gap = 10, pl = 64, H = rows.length * (rowH + gap) + 8;
      let s = '';
      rows.forEach((r, i) => {
        const tot = r.c.reduce((a, b) => a + b, 0); let acc = 0; const yy = 4 + i * (rowH + gap);
        s += '<text class="ch__lbl" x="' + (pl - 10) + '" y="' + (yy + 15) + '" text-anchor="end">' + r.y + (r.partial ? '*' : '') + '</text>';
        r.c.forEach((v, k) => { if (!v) return; const x = pl + (W - pl - 8) * acc / tot, w = (W - pl - 8) * v / tot; s += '<rect class="ch__bar cat' + (k + 1) + '" x="' + x.toFixed(1) + '" y="' + yy + '" width="' + Math.max(0.5, w).toFixed(1) + '" height="' + rowH + '"><title>' + r.y + ' · ' + cats[k] + ': ' + (v / tot * 100).toFixed(1) + '%</title></rect>'; if (w > 38) s += '<text class="ch__in" x="' + (x + 6) + '" y="' + (yy + 15) + '">' + Math.round(v / tot * 100) + '%</text>'; acc += v; });
      });
      return '<div class="chwrap"><svg class="ch" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + C.esc(o.label || '') + '">' + s + '</svg></div>';
    },
    hbars(rows, o = {}) {
      const W = o.w || svgW, rowH = 20, gap = 12, pl = o.pl || 210, pr = 70, H = rows.length * (rowH + gap) + 6;
      const mx = Math.max(...rows.map(r => r[1]));
      let s = '';
      rows.forEach((r, i) => { const yy = 3 + i * (rowH + gap), w = (W - pl - pr) * r[1] / mx; s += '<text class="ch__lbl" x="' + (pl - 10) + '" y="' + (yy + 14) + '" text-anchor="end">' + C.esc(r[0]) + '</text><rect class="ch__bar' + (o.cls ? ' ' + o.cls(r, i) : ' cat1') + '" x="' + pl + '" y="' + yy + '" width="' + Math.max(1, w).toFixed(1) + '" height="' + rowH + '"><title>' + C.esc(r[0]) + ': ' + F.int(r[1]) + '</title></rect><text class="ch__val" x="' + (pl + w + 8) + '" y="' + (yy + 14) + '">' + (o.fmt ? o.fmt(r) : F.int(r[1])) + '</text>'; });
      return '<div class="chwrap"><svg class="ch" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + C.esc(o.label || '') + '">' + s + '</svg></div>';
    }
  };

        <dl class="stats stats--hero" data-d="D5813 D4226 PAIR-1325 D3646">${[['Settled sales', '41'], ['Sale value recorded', F.usd(D.soldStats.value)], ['Auction sales', '35'], ['Direct sales', '6'], ['Median sale', F.usd(median)]].map(([k, v]) => h`<div><dt>${k}</dt><dd>${v}</dd></div>`)}</dl>

        : h`
        <header class="ph">${V.eyebrow('Public research archive')}<h1 class="ph__t">${raw(sk.pageTitle ? sk.pageTitle('Market') : 'Market')}</h1><p class="ph__lede">What Bitcoin collectibles have sold for. Every record below is an observation of a sale that took place at another venue — not a sale made by CLCT — and each one names its source. Where the source recorded only a month or a year, that is what is shown.</p></header>
        <dl class="stats stats--hero">${[['Records', F.int(A.records), A.span], ['Recorded USD', F.usd(A.usd), ''], ['Recorded BTC', A.btc + ' BTC', ''], ['Median observed sale', F.usd(A.median), 'Middle half ' + F.usd(A.iqr[0]) + '–' + F.usd(A.iqr[1])]].map(([k, v, s2]) => h`<div><dt>${k}</dt><dd>${v}</dd>${s2 ? h`<p class="stats__s">${s2}</p>` : ''}</div>`)}</dl>
        <section class="sec" data-tour="market-plot">${V.sectionHead('Recorded sales by year', 'Every observation the archive holds, by the year its source recorded. * Archive incomplete for this year.', h`<ul class="legend">${A.cats.map((c, i) => h`<li><i class="sw cat${i + 1}"></i>${c}</li>`)}</ul>`)}${raw(V.chart.stacked(A.byYear, A.cats, { label: 'Records by year, stacked by category', w: 1120, h: 320 }))}
          <details class="inst__table"><summary>This chart as a table</summary><div class="tablewrap"><table class="tbl"><thead><tr><th>Year</th>${A.cats.map(c => h`<th class="num">${c}</th>`)}<th class="num">Records</th><th class="num">Recorded USD</th></tr></thead><tbody>${A.byYear.map(r => h`<tr><td>${r.y}${r.partial ? '*' : ''}</td>${r.c.map(v => h`<td class="num">${F.int(v)}</td>`)}<td class="num">${F.int(r.n)}</td><td class="num">${r.usd}</td></tr>`)}</tbody></table></div></details></section>

            '<div class="field field--money"><label for="w-ask">The price you would consider</label><div class="money"><span aria-hidden="true">$</span><input id="w-ask" inputmode="decimal" value="' + C.esc(d.ask || '') + '"></div><p class="hint">A starting point for the conversation, not a commitment.</p></div>' +

            '<div class="review__acts"><button type="submit" class="btn btn--ink">Continue</button><button type="button" class="btn btn--ghost" data-back>Back</button></div><p class="review__msg" role="alert" data-msg></p></form>'; }

        <header class="ph ph--acct"><div>${V.eyebrow('Private collector record · private by construction')}<h1 class="ph__t">${raw(S().pageTitle ? S().pageTitle('Your record') : 'Your record')} <span class="acct__h mono">${C.user.display}</span></h1></div><p class="acct__meta mono">Entered ${C.user.entered} · In good standing · Demo collector</p></header>
        <div class="acct" data-d="D0064 D2121 LAW-18">
          <nav class="acct__nav" aria-label="Record sections"><ul>${tabs.map(([id, t]) => h`<li><a href="#account-${id}" data-go="account-${id}" ${id === tab ? raw('aria-current="page"') : ''}>${t}<span class="acct__n" data-n="${id}"></span></a></li>`)}</ul></nav>
          <div class="acct__body" data-acct></div>
        </div>`,
      mount(root) {
        const body = C.$('[data-acct]', root);
        const draw = () => {
          const s = C.session, myLots = s.list().filter(a => a.youBid()), watch = Array.from(C.user.watch).map(id => C.lot(id)).filter(Boolean);
          const n = { overview: '', bidding: myLots.length || '', watchlist: watch.length || '', purchases: C.user.invoices.length || '', offers: C.user.offers.length || '', selling: C.user.submissions.length || '', settings: '' };
          C.$$('[data-n]', root).forEach(el => el.textContent = n[el.dataset.n] ? ' ' + n[el.dataset.n] : '');
          const lotRow = (a) => '<li class="arow" data-live-host><a href="#lot-' + a.id + '" data-go="lot-' + a.id + '"><img alt="" src="' + C.imgThumb(a.rec.img[0]) + '"><span class="arow__t"><b>' + C.esc(a.rec.title) + '</b><span class="muted">' + (a.youLead() ? 'Leading' : a.state === 'sold' && a.winner === C.user.handle ? 'Won' : a.youBid() ? 'Outbid' : 'Watching') + (a.you.max ? ' · your maximum ' + F.usd(a.you.max) : '') + '</span></span><span class="arow__p mono" data-live-price="' + a.id + '">' + F.usd(a.current || a.opening) + '</span><span class="arow__c mono" data-live-clock="' + a.id + '">' + F.clock(a.endsAt - C.clock.now()) + '</span></a></li>';
          const invRow = (i) => '<li class="arow"><a href="#invoice-' + i.id + '" data-go="invoice-' + i.id + '"><img alt="" src="' + C.imgThumb(i.lot.img[0]) + '"><span class="arow__t"><b>' + C.esc(i.lot.title) + '</b><span class="muted">' + i.id + ' · ' + ({ due: 'Due — pay within 48 hours', awaiting: 'Payment request open', seen: 'Payment seen', confirming: i.confs + ' of 6 confirmations', settled: 'Settled' })[i.status] + '</span></span><span class="arow__p mono">' + F.usd(i.total) + '</span><span class="pill' + (i.status === 'settled' ? ' pill--ok' : '') + '">' + (i.status === 'settled' ? 'Settled' : 'Pay') + '</span></a></li>';
          let html = '';
          if (tab === 'overview') {
            const due = C.user.invoices.filter(i => i.status !== 'settled');
            html = '<dl class="stats">' + [['Active bids', myLots.filter(a => a.state === 'live').length], ['Watching', watch.length], ['Invoices due', due.length], ['Open offers', C.user.offers.filter(o => o.status === 'pending' || o.status === 'countered').length]].map(([k, v]) => '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>').join('') + '</dl>' +
              '<h2 class="sh__t">Your auctions, ending soonest</h2>' + (s.list().filter(a => a.youBid() || C.user.watch.has(a.id)).length ? '<ol class="alist">' + s.list().filter(a => a.youBid() || C.user.watch.has(a.id)).sort((x, y) => x.endsAt - y.endsAt).map(lotRow).join('') + '</ol>' : '<p class="empty">Your auctions, in one place. Watch a lot to follow its close and bid from here when you’re ready. <a class="lnk" href="#auctions" data-go="auctions">Explore auctions</a></p>') +
              (due.length ? '<h2 class="sh__t">Invoices due</h2><ol class="alist">' + due.map(invRow).join('') + '</ol>' : '');
          }
          if (tab === 'bidding') html = '<h2 class="sh__t">Active bidding</h2>' + (myLots.length ? '<ol class="alist">' + myLots.map(lotRow).join('') + '</ol>' : '<p class="empty">No active bids. Completed and unsuccessful bidding history appears here after your first bid.</p>');
          if (tab === 'watchlist') html = '<h2 class="sh__t">Watchlist · held for study</h2>' + (watch.length ? '<ol class="alist">' + watch.map(r => { const a = s.get(r.id); return a ? lotRow(a) : '<li class="arow"><a href="#' + V.lotHref(r) + '" data-go="' + V.lotHref(r) + '"><img alt="" src="' + C.imgThumb(r.img[0]) + '"><span class="arow__t"><b>' + C.esc(r.title) + '</b><span class="muted">' + (r.status === 'forsale' ? 'For sale' : r.status === 'sold' ? 'Sold' : 'Unsold') + '</span></span><span class="arow__p mono">' + F.usd(r.price) + '</span><span></span></a></li>'; }).join('') + '</ol>' : '<p class="empty">Nothing watched yet.</p>');
          if (tab === 'purchases') html = '<h2 class="sh__t">Purchases · settlement record</h2>' + (C.user.invoices.length ? '<ol class="alist">' + C.user.invoices.map(invRow).join('') + '</ol>' : '<p class="empty">No purchases yet. Win a lot in the simulated session, acquire a card, or have an offer accepted — the invoice appears here.</p>');
          if (tab === 'offers') html = '<h2 class="sh__t">Offers</h2>' + (C.user.offers.length ? '<ol class="alist">' + C.user.offers.map(o => '<li class="arow"><a href="#card-' + o.rec.id + '" data-go="card-' + o.rec.id + '"><img alt="" src="' + C.imgThumb(o.rec.img[0]) + '"><span class="arow__t"><b>' + C.esc(o.rec.title) + '</b><span class="muted">' + o.id + ' · ' + ({ pending: 'Awaiting the house', countered: 'Countered at ' + F.usd(o.counter), accepted: 'Accepted', declined: 'Declined', withdrawn: 'Withdrawn' })[o.status] + '</span></span><span class="arow__p mono">' + F.usd(o.amount) + '</span><span></span></a></li>').join('') + '</ol>' : '<p class="empty">No offers yet. Offers are private and time-bound, and never reserve a lot.</p>');
          if (tab === 'selling') html = '<h2 class="sh__t">Consigned to CLCT</h2>' + (C.user.submissions.length ? '<ol class="alist">' + C.user.submissions.map(su => '<li class="arow"><span class="arow__a"><span class="arow__t"><b>' + C.esc(su.title) + '</b><span class="muted">' + su.id + ' · ' + su.status + '</span></span></span></li>').join('') + '</ol>' : '<p class="empty">Nothing submitted yet. <a class="lnk" href="#sell" data-go="sell">Submit an item</a>.</p>');
          if (tab === 'settings') html = '<h2 class="sh__t">Profile & settings</h2><div class="settings"><fieldset class="fs"><legend>Theme</legend>' + ['auto', 'light', 'dark'].map(v => '<label class="check"><input type="radio" name="th" value="' + v + '"' + (C.theme.pref === v ? ' checked' : '') + '><span>' + (v === 'auto' ? 'Match my system' : v[0].toUpperCase() + v.slice(1)) + '</span></label>').join('') + '</fieldset><fieldset class="fs"><legend>Motion</legend>' + ['auto', 'reduce', 'full'].map(v => '<label class="check"><input type="radio" name="mo" value="' + v + '"' + (C.motion.pref === v ? ' checked' : '') + '><span>' + ({ auto: 'Match my system', reduce: 'Reduce motion', full: 'Full motion' })[v] + '</span></label>').join('') + '</fieldset><fieldset class="fs"><legend>Show bid charts in</legend>' + ['usd', 'btc', 'sats'].map(v => '<label class="check"><input type="radio" name="un" value="' + v + '"' + (C.user.unit === v ? ' checked' : '') + '><span>' + v.toUpperCase() + '</span></label>').join('') + '</fieldset><fieldset class="fs"><legend>Email me about</legend><label class="check"><input type="checkbox" checked><span>Auction openings and closing reminders</span></label><label class="check"><input type="checkbox" checked><span>Outbid alerts</span></label><label class="check"><input type="checkbox"><span>New collection releases</span></label></fieldset><p class="note small">Your email address, delivery details, and anything you add to your profile are never published — public bid history shows a masked username only.</p></div>';
          body.innerHTML = html;
        };
        draw();
        body.addEventListener('change', (e) => { const t = e.target; if (t.name === 'th') C.theme.set(t.value); if (t.name === 'mo') C.motion.set(t.value); if (t.name === 'un') C.user.setUnit(t.value); });
        const offs = ['bid', 'invoice', 'offer', 'watch', 'submission', 'closed'].map(ev => C.on(ev, () => { if (!body.contains(document.activeElement)) draw(); }));
        return offs;
      }
    };
  };

  /* ===================================================================== INVOICE / PAY */
  V.invoice = (p) => {
    const inv = C.invoices.get(p.id); if (!inv) return V.notfound(p);
    const r = inv.lot;
    return {
      title: 'Invoice ' + inv.id,
      html: h`${V.slug('Invoice ' + inv.id)}
        <nav class="crumbs" aria-label="Breadcrumb"><a href="#account-purchases" data-go="account-purchases">Your record</a><span aria-hidden="true">/</span><span aria-current="page">Invoice ${inv.id}</span></nav>
        <article class="inv" data-d="GC02 GC07 D3792 D5828 LAW-58 LAW-62 PAIR-338">
          <div class="inv__l">
            <header class="inv__hd"><p class="eyebrow">Invoice ${inv.id} · ${({ auction: 'Auction win', fixed: 'Fixed-price purchase', offer: 'Accepted offer' })[inv.kind]}</p><h1 class="ph__t">${raw(S().pageTitle ? S().pageTitle('Settle in bitcoin') : 'Settle in bitcoin')}</h1>
              <p class="ph__lede">The obligation is fixed in U.S. dollars. The Bitcoin amount is worked out against it when you generate a payment request and holds for 15 minutes; after that a fresh request quotes a fresh amount for the same dollar total.</p></header>
            <div class="inv__lot">${V.img(r.img[0], r.title)}<div><p class="eyebrow">${r.maker || r.set || ''}</p><p class="review__t">${r.title}</p><p class="muted">${inv.qty > 1 ? inv.qty + ' units · ' : ''}Issued ${F.dayTime(inv.createdAt)} · due within 48 hours</p></div></div>
            <dl class="ledgerx ledgerx--inv">
              <div><dt>${inv.kind === 'auction' ? 'Winning bid · hammer' : inv.kind === 'offer' ? 'Accepted offer' : 'Price'}${inv.qty > 1 ? ' × ' + inv.qty : ''}</dt><dd>${F.usd(inv.amount * inv.qty)}</dd></div>
              <div><dt>Buyer’s premium (5%)</dt><dd>${F.usd(inv.premium)}</dd></div>
              ${inv.shipping ? h`<div><dt>Shipping · fixed charge</dt><dd>${F.usd(inv.shipping)}</dd></div>` : ''}
              <div class="ledgerx__total"><dt>Amount due · USD</dt><dd>${F.usd(inv.total)}</dd></div>
            </dl>
            <p class="note small">Applicable sales tax, packaging and insurance are additional where not stated. CLCT packages shipments professionally, ships them insured, and emails tracking once a lot is on its way.</p>
          </div>
          <div class="inv__r"><div class="pay" data-pay></div></div>
        </article>`,
      mount(root) {
        const pay = C.$('[data-pay]', root); let tmr = 0;
        const draw = () => {
          let html = '';
          if (inv.status === 'due') {
            html = '<p class="eyebrow">Choose how to pay</p><div class="seg seg--big" role="group" aria-label="Payment method"><button type="button" data-m="lightning" data-tour="pay-lightning" aria-pressed="' + (inv.pick === 'lightning') + '">' + C.icon('bolt') + ' Lightning</button><button type="button" data-m="onchain" aria-pressed="' + (inv.pick === 'onchain') + '">' + C.icon('chain') + ' On-chain</button></div>' +
              '<p class="note small">' + (inv.pick === 'onchain' ? 'On-chain payments are final at six confirmations. One confirmation is provisional.' : 'Lightning settles in seconds — no confirmations to wait for.') + '</p>' +
              '<button type="button" class="btn btn--ink btn--block" data-gen data-tour="pay-generate">Generate payment request</button><p class="note small">Generating a request locks a Bitcoin amount for 15 minutes against ' + F.usd(inv.total) + '.</p>';
          } else if (inv.status === 'awaiting') {
            const q = inv.quote, ln = inv.method === 'lightning';
            html = '<div class="quote"><p class="eyebrow">' + (ln ? 'Lightning request' : 'On-chain request') + ' · price hold</p>' +
              '<p class="quote__amt mono">' + (ln ? F.sats(q.sats) + ' <span>sats</span>' : F.btc(q.sats, 8) + ' <span>BTC</span>') + '</p>' +
              '<p class="muted small">' + F.usd(inv.total) + ' at $' + Math.round(q.rate).toLocaleString('en-US') + ' per bitcoin · indicative quote</p>' +
              '<div class="hold" data-hold><span class="hold__lbl">Price held for</span><b class="mono" data-hold-t>15:00</b><i class="hold__bar"><i data-hold-bar></i></i></div>' +
              '<figure class="qr"><canvas class="qr__cv" data-qr width="232" height="232" role="img" aria-label="Demo payment code — not payable"></canvas><figcaption>Demo code · not payable</figcaption></figure>' +
              '<div class="copyrow"><code class="mono" data-ref>' + C.esc(inv.ref) + '</code><button type="button" class="btn btn--ghost btn--xs" data-copy="' + C.esc(inv.ref) + '" data-copy-ok="Demo reference copied">' + C.icon('copy') + '<span>Copy</span></button></div>' +
              '<p class="note small">This is a design mockup. No payment request was generated and nothing can be paid here.</p>' +
              '<button type="button" class="btn btn--ink btn--block" data-sim data-tour="pay-simulate">Simulate the payment arriving</button><button type="button" class="btn btn--ghost btn--block" data-cancel>Choose another method</button></div>';
          } else if (inv.status === 'seen' || inv.status === 'confirming') {
            html = '<div class="conf" data-d="D3627 D0975 LAW-58"><p class="eyebrow">Payment seen · on-chain</p><h2 class="sh__t">' + (inv.confs ? inv.confs + ' of 6 confirmations' : 'Waiting for the first confirmation') + '</h2><ol class="conf__l">' + [1, 2, 3, 4, 5, 6].map(k => '<li class="' + (k <= inv.confs ? 'is-on' : '') + (k === 1 ? ' is-prov' : '') + (k === 6 ? ' is-final' : '') + '"><span class="mono">' + k + '</span><span>' + (k === 1 ? 'Provisional' : k === 6 ? 'Final' : '') + '</span></li>').join('') + '</ol><p class="note small">One confirmation is provisional; six is final. While you wait: CLCT will email you to confirm the delivery address once payment settles.</p><p class="mono small muted">txid ' + C.esc(inv.txid.slice(0, 16)) + '…' + C.esc(inv.txid.slice(-8)) + ' · demo</p></div>';
          } else if (inv.status === 'settled') {
            html = '<div class="settled" data-d="D3633 PAIR-331 D4157 D3792"><p class="eyebrow">Settled · ' + F.dayTime(inv.settledAt) + '</p><h2 class="sh__t">Payment settled. The record is permanent.</h2>' +
              '<figure class="receipt"><canvas data-receipt width="320" height="320" role="img" aria-label="Receipt artwork generated from the transaction id"></canvas><figcaption>Receipt artwork, seeded from the ' + (inv.method === 'lightning' ? 'payment preimage' : 'transaction id') + ' — the same id always draws the same plate.</figcaption></figure>' +
              '<dl class="ledgerx"><div><dt>Paid</dt><dd>' + F.usd(inv.total) + '</dd></div><div><dt>Method</dt><dd>' + (inv.method === 'lightning' ? 'Lightning' : 'On-chain · 6 confirmations') + '</dd></div><div><dt>' + (inv.method === 'lightning' ? 'Preimage' : 'Transaction') + '</dt><dd class="mono small">' + C.esc((inv.preimage || inv.txid).slice(0, 18)) + '… (demo)</dd></div></dl>' +
              '<h3 class="sub">What happens next</h3><ol class="numbered numbered--sm"><li><p>CLCT emails you to confirm the delivery address and arrange fulfillment.</p></li><li><p>CLCT packages the lot, ships it insured, and emails you the tracking details.</p></li></ol><a class="btn btn--line" href="#account-purchases" data-go="account-purchases">Back to your record</a></div>';
          }
          pay.innerHTML = html;
          if (inv.status === 'awaiting') {
            S().qr(C.$('[data-qr]', pay), inv);
            clearInterval(tmr); const ht = C.$('[data-hold-t]', pay), hb = C.$('[data-hold-bar]', pay);
            const upd = () => { const left = inv.quote.expiresAt - C.clock.now(); if (left <= 0) { clearInterval(tmr); inv.status = 'due'; inv.quote = null; C.toast({ title: 'Quote expired', body: 'Generate a fresh request — the dollar total stays the same.', kind: 'info' }); draw(); return; } ht.textContent = F.clock(left); hb.style.transform = 'scaleX(' + (left / (15 * 60e3)) + ')'; };
            upd(); tmr = setInterval(upd, 500);
          }
          if (inv.status === 'settled') S().receipt(C.$('[data-receipt]', pay), inv);
        };
        pay.addEventListener('click', (e) => {
          const m = e.target.closest('[data-m]'); if (m) { inv.pick = m.dataset.m; draw(); }
          if (e.target.closest('[data-gen]')) { C.pay.request(inv, inv.pick || 'lightning'); draw(); }
          if (e.target.closest('[data-sim]')) { C.pay.simulate(inv); draw(); }
          if (e.target.closest('[data-cancel]')) { inv.status = 'due'; inv.quote = null; draw(); }
        });
        if (!inv.pick) inv.pick = 'lightning';
        draw();
        const off = C.on('invoice', (x) => { if (x === inv) draw(); });
        return [off, () => clearInterval(tmr)];
      }
    };
  };

  /* ===================================================================== ARTIST */
  V.artist = (p) => {
    const a = D.artists.find(x => x.slug === p.slug); if (!a) return V.notfound(p);
    const works = D.generations.filter(r => r.maker === a.name);
    return {
      title: a.name,
      html: h`${V.slug('Artists & Makers')}
        <header class="ph">${V.eyebrow('Artists & Makers')}<h1 class="ph__t">${raw(S().pageTitle ? S().pageTitle(a.name) : a.name)}</h1>${a.bio ? h`<p class="ph__lede">${a.bio}</p>` : ''}</header>
        <section class="sec">${V.sectionHead('Works by ' + a.name, 'Everything of theirs CLCT has catalogued — including the works that have already sold.', h`<p class="count">${works.length}</p>`)}
          <div class="tiles tiles--grid">${works.map(r => h`<article class="tile"><a class="tile__link" href="#${V.lotHref(r)}" data-go="${V.lotHref(r)}" aria-label="${r.title}"></a><figure class="tile__fig">${V.img(r.img[0], r.title)}</figure><div class="tile__body"><p class="tile__set">${r.medium}</p><h3 class="tile__t">${r.title}</h3><p class="tile__p">${C.session.get(r.id) ? h`<span class="pill pill--live" data-live-pill="${r.id}">Live</span>` : r.status === 'sold' ? h`<span class="mono">${F.usd(r.price)}</span><span class="badge badge--sold">Sold</span>` : r.status === 'unsold' ? h`<span class="muted">Unsold · opening ${F.usd(r.price)}</span>` : h`<span class="mono">${F.usd(r.price)}</span><span class="badge">For sale</span>`}</p></div></article>`)}</div></section>
        <section class="sec"><h2 class="sh__t">Collections</h2><p><a class="lnk" href="#generations" data-go="generations">Generations ${raw(C.icon('arrow'))}</a></p><p class="note">Creator market context: no public-market observation has been canonically associated with this creator yet.</p></section>`,
      mount() { }
    };
  };

  /* ===================================================================== SEARCH */
  V.search = () => ({
    title: 'Search',
    html: h`${V.slug('Search')}<header class="ph"><h1 class="ph__t">Search</h1></header><div class="field"><label for="sq">Refine your search</label><input id="sq" type="search" placeholder="Lots, cards, artists, stories" autofocus></div><ol class="sres" data-sres></ol>`,
    mount(root) { const q = C.$('#sq', root), out = C.$('[data-sres]', root); const run = () => { const res = C.search(q.value); out.innerHTML = res.length ? res.map(r => '<li><a href="#' + r.route + '" data-go="' + r.route + '"><span class="tag">' + C.esc(r.type) + '</span><b>' + C.esc(r.title) + '</b><span class="muted">' + C.esc(r.sub) + '</span></a></li>').join('') : (q.value ? '<li class="empty">No matches. Everything currently on sale is also listed under Auctions.</li>' : ''); }; q.addEventListener('input', run); }
  });

  /* ===================================================================== MARK — the 100 stylings */
  V.mark = () => {
    const fams = D.markFamilies;
    return {
      title: 'The mark · 100 stylings',
      html: h`${V.slug('Identity study · 100 stylings')}
        <header class="ph">${V.eyebrow('Identity study')}<h1 class="ph__t">${raw(S().pageTitle ? S().pageTitle('The mark, 100 ways.') : 'The mark, 100 ways.')}</h1><p class="ph__lede">One four-letter wordmark set a hundred ways — maps, presses, signals, dithers, patterns, growth, materials, kinetic type, movements and the chain. The home page cycles through all of them.</p><p class="count">100 stylings · 10 families of 10</p></header>
        <div class="chips" role="group" aria-label="Filter by family" data-fam><button type="button" class="chip is-on" data-f="">All 100</button>${fams.map(f => h`<button type="button" class="chip" data-f="${f}">${f}</button>`)}</div>
        <ol class="marks" data-marks data-d="GR119 D3508">${D.marks.map(m => h`<li class="marks__i" data-family="${m.family}"><button type="button" data-mark="${m.n}" aria-label="No. ${m.n}, ${m.name}"><img src="${m.src}" alt="" loading="lazy"><span class="marks__n mono">${String(m.n).padStart(3, '0')}</span><span class="marks__t">${m.name}</span></button></li>`)}</ol>`,
      mount(root) {
        C.$('[data-fam]', root).addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (!b) return; C.$$('[data-f]', root).forEach(x => x.classList.toggle('is-on', x === b)); C.$$('.marks__i', root).forEach(li => li.hidden = !!b.dataset.f && li.dataset.family !== b.dataset.f); });
        C.$('[data-marks]', root).addEventListener('click', (e) => { const b = e.target.closest('[data-mark]'); if (b) V.markViewer(+b.dataset.mark - 1, b); });
      }
    };
  };
  V.markViewer = (i, origin) => {
    let k = i;
    const hd = C.overlay.open({ title: 'The mark', origin, className: 'markview', html: '<figure class="mv"><img data-mv alt=""><figcaption data-mvc></figcaption></figure><div class="mv__nav"><button type="button" class="btn btn--ghost" data-mvp>' + C.icon('left') + '<span>Previous</span></button><button type="button" class="btn btn--ghost" data-mvn><span>Next</span>' + C.icon('right') + '</button></div>' });
    const draw = () => { const m = D.marks[k]; C.$('[data-mv]', hd.root).src = m.src; C.$('[data-mv]', hd.root).alt = 'CLCT wordmark, styling ' + m.n + ': ' + m.name; C.$('[data-mvc]', hd.root).innerHTML = '<span class="mono">No. ' + String(m.n).padStart(3, '0') + '</span> ' + C.esc(m.name) + ' <span class="muted">· ' + C.esc(m.family) + '</span>'; };
    C.$('[data-mvp]', hd.root).onclick = () => { k = (k + 99) % 100; draw(); };
    C.$('[data-mvn]', hd.root).onclick = () => { k = (k + 1) % 100; draw(); };
    hd.root.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') { k = (k + 1) % 100; draw(); } if (e.key === 'ArrowLeft') { k = (k + 99) % 100; draw(); } });
    draw();
  };

  /* ===================================================================== D650 LEDGER */
  V.ledger = () => {
    const reg = C.D650 || {};

      for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) { let e = 0; const u = i / (gw - 1), v = j / (gh - 1); pts.forEach(q => { const qu = (q.x - pl) / W, qv = (q.y - pt) / H, dx = (u - qu) * (W / H), dy = v - qv; e += Math.exp(-(dx * dx + dy * dy) / (2 * sig * sig)) * (0.6 + 0.4 * Math.log10(q.p / 4000)); }); fld[j * gw + i] = e; }
